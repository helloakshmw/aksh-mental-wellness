<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AKSH — A Safe Space For Every Mind</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Helvetica Neue",Arial,sans-serif;
}

#page{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#050609;
}

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.04);
  transition:opacity 1.8s ease,transform 8s ease;
}

#video.show{
  opacity:1;
  transform:scale(1);
}

.overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.20) 0%,
      rgba(0,0,0,.02) 35%,
      rgba(0,0,0,.12) 65%,
      rgba(0,0,0,.42) 100%
    );
  pointer-events:none;
}

.top{
  position:absolute;
  top:7%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  z-index:5;
}

#icon{
  width:76px;
  height:76px;
  object-fit:contain;
  margin-bottom:15px;
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.3));
}

#watermark{
  font-size:15px;
  letter-spacing:.48em;
  margin-left:.48em;
  font-weight:400;
  color:rgba(255,255,255,.72);
  text-shadow:0 3px 18px rgba(0,0,0,.35);
}

#tagline{
  margin-top:9px;
  font-size:11px;
  letter-spacing:.11em;
  font-weight:300;
  color:rgba(255,255,255,.90);
  white-space:nowrap;
  text-shadow:0 3px 18px rgba(0,0,0,.4);
}

#date{
  position:absolute;
  top:5.5%;
  left:5%;
  z-index:5;
  font-size:10px;
  letter-spacing:.14em;
  color:rgba(255,255,255,.82);
  text-shadow:0 3px 15px rgba(0,0,0,.4);
}

#day{
  position:absolute;
  top:5.5%;
  right:5%;
  z-index:5;
  font-size:10px;
  letter-spacing:.14em;
  color:rgba(255,255,255,.82);
  text-shadow:0 3px 15px rgba(0,0,0,.4);
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
  pointer-events:none;
}

#greeting{
  font-size:clamp(38px,8vw,82px);
  font-weight:300;
  letter-spacing:-.035em;
  color:white;
  text-shadow:
    0 5px 35px rgba(0,0,0,.42),
    0 1px 2px rgba(0,0,0,.25);
  animation:fadeUp 1.8s ease both;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

#journey{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  z-index:6;

  padding:15px 30px;
  min-width:205px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:rgba(255,255,255,.10);
  color:white;

  font-size:10px;
  font-weight:400;
  letter-spacing:.19em;
  text-transform:uppercase;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.18);

  transition:.35s ease;
}

#journey:active{
  transform:translateX(-50%) scale(.96);
}

#sound{
  position:absolute;
  right:5%;
  bottom:5.5%;
  z-index:8;

  width:43px;
  height:43px;

  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);

  background:rgba(0,0,0,.16);
  color:white;

  font-size:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

#fade{
  position:absolute;
  inset:0;
  background:#050609;
  opacity:0;
  pointer-events:none;
  z-index:20;
  transition:opacity .8s ease;
}

#fade.on{
  opacity:1;
}

@media(max-width:600px){

  .top{
    top:8%;
  }

  #icon{
    width:68px;
    height:68px;
  }

  #watermark{
    font-size:14px;
  }

  #tagline{
    font-size:9px;
    letter-spacing:.08em;
  }

  #date,
  #day{
    top:4.5%;
    font-size:8px;
  }

  #date{
    left:5%;
  }

  #day{
    right:5%;
  }

  #greeting{
    font-size:42px;
  }

  #journey{
    bottom:10%;
    min-width:190px;
    padding:14px 24px;
  }

  #sound{
    right:5%;
    bottom:4.5%;
  }
}
</style>
</head>

<body>

<div id="page">

  <video
    id="video"
    autoplay
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div class="overlay"></div>

  <div id="date"></div>
  <div id="day"></div>

  <div class="top">
    <img id="icon" src="aksh-icon.PNG" alt="AKSH">
    <div id="watermark">AKSH</div>
    <div id="tagline">A Safe Space For Every Mind</div>
  </div>

  <div class="center">
    <div id="greeting"></div>
  </div>

  <button id="journey">Begin Your Journey</button>

  <button id="sound">🔊</button>

  <div id="fade"></div>

</div>

<script>

const video = document.getElementById("video");
const greeting = document.getElementById("greeting");
const dateBox = document.getElementById("date");
const dayBox = document.getElementById("day");
const sound = document.getElementById("sound");
const journey = document.getElementById("journey");
const fade = document.getElementById("fade");

const files = {
  morning1: "aksh-morning.1.mov",
  morning2: "aksh-morning.2.mov",
  morning3: "aksh-morning.3.mov",
  morning4: "aksh-morning.4.mov",

  afternoon1: "aksh-afternoon.1.mov",
  afternoon2: "aksh-afternoon.2.mov",
  afternoon3: "aksh-afternoon.3.mov",
  afternoon4: "aksh-afternoon.4.mov",

  evening1: "aksh-evening.1.mov",
  evening2: "aksh-evening.2.mov",
  evening3: "aksh-morning.4.mov",

  night1: "aksh-night.1.mov",
  night2: "aksh-night.2.mov"
};

function updateClock(){

  const now = new Date();

  const h = now.getHours();
  const m = now.getMinutes();

  const total = h * 60 + m;

  let message = "";
  let selected = "";

  if(total >= 300 && total < 360){

    message = "Good Morning";
    selected = files.morning1;

  }else if(total >= 360 && total < 480){

    message = "Good Morning";
    selected = files.morning2;

  }else if(total >= 480 && total < 600){

    message = "Good Morning";
    selected = files.morning3;

  }else if(total >= 600 && total < 720){

    message = "Good Morning";
    selected = files.morning4;

  }else if(total >= 720 && total < 780){

    message = "Good Afternoon";
    selected = files.afternoon1;

  }else if(total >= 780 && total < 870){

    message = "Good Afternoon";
    selected = files.afternoon2;

  }else if(total >= 870 && total < 960){

    message = "Good Afternoon";
    selected = files.afternoon3;

  }else if(total >= 960 && total < 1020){

    message = "Good Afternoon";
    selected = files.afternoon4;

  }else if(total >= 1020 && total < 1065){

    message = "Good Evening";
    selected = files.evening1;

  }else if(total >= 1065 && total < 1140){

    message = "Good Evening";
    selected = files.evening2;

  }else if(total >= 1140 && total < 1200){

    message = "Good Evening";
    selected = files.evening3;

  }else if(total >= 1200){

    message = "Good Night";
    selected = files.night1;

  }else{

    message = "Good Night";
    selected = files.night2;

  }

  greeting.textContent = message;

  dateBox.textContent =
    now.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ).toUpperCase();

  dayBox.textContent =
    now.toLocaleDateString(
      "en-IN",
      {
        weekday:"long"
      }
    ).toUpperCase();

  if(
    !video.src ||
    !video.src.endsWith(selected)
  ){

    video.classList.remove("show");

    video.src = selected;
    video.load();

    video.muted = false;
    video.volume = 1;

    video.play()
      .then(()=>{
        sound.textContent = "🔊";
      })
      .catch(()=>{
        video.muted = true;
        video.play().catch(()=>{});
        sound.textContent = "🔊";
      });

    video.addEventListener(
      "canplay",
      ()=>{
        video.classList.add("show");
      },
      {once:true}
    );
  }
}

sound.addEventListener("click",()=>{

  if(video.muted){

    video.muted = false;
    video.volume = 1;
    sound.textContent = "🔊";

    video.play().catch(()=>{});

  }else{

    video.muted = true;
    sound.textContent = "🔇";

  }

});

journey.addEventListener("click",()=>{

  fade.classList.add("on");

  setTimeout(()=>{
    window.location.href = "page1.html";
  },800);

});

updateClock();

setInterval(updateClock,15000);

</script>

</body>
</html>
