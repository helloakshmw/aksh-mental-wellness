<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>AKSH — A Safe Space For Every Mind</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

body{
  color:#fff;
}

#experience{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#08090d;
}

#backgroundVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.035);
  transition:opacity 1.8s ease,transform 8s ease;
}

#backgroundVideo.visible{
  opacity:1;
  transform:scale(1);
}

#atmosphere{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.12),
      transparent 42%
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.12) 0%,
      rgba(0,0,0,.04) 40%,
      rgba(0,0,0,.28) 72%,
      rgba(0,0,0,.72) 100%
    );
  pointer-events:none;
}

#grain{
  position:absolute;
  inset:-50%;
  opacity:.045;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
  animation:grainMove .25s steps(2) infinite;
}

@keyframes grainMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,-1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(-2%,-1%)}
}

#interface{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:
    max(28px,env(safe-area-inset-top))
    24px
    max(32px,env(safe-area-inset-bottom))
    24px;
}

#mark{
  width:58px;
  height:58px;
  border:1px solid rgba(255,255,255,.58);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:30px;
  background:rgba(255,255,255,.075);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 18px 60px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.25);
  animation:floatMark 5s ease-in-out infinite;
}

#markCore{
  width:22px;
  height:22px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:50%;
  position:relative;
}

#markCore:after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 18px rgba(255,255,255,.75);
}

@keyframes floatMark{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

#time{
  position:absolute;
  top:7%;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  letter-spacing:.38em;
  text-transform:uppercase;
  color:rgba(255,255,255,.62);
}

#greeting{
  font-size:clamp(42px,8vw,86px);
  line-height:.98;
  font-weight:400;
  letter-spacing:-.055em;
  text-shadow:
    0 8px 35px rgba(0,0,0,.3),
    0 1px 1px rgba(0,0,0,.25);
  margin-bottom:22px;
}

#message{
  max-width:620px;
  font-size:clamp(15px,2vw,19px);
  line-height:1.65;
  font-weight:300;
  color:rgba(255,255,255,.9);
  text-shadow:0 4px 22px rgba(0,0,0,.45);
}

#tagline{
  position:absolute;
  bottom:24%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:clamp(9px,1.4vw,14px);
  letter-spacing:.3em;
  text-transform:uppercase;
  color:rgba(255,255,255,.84);
}

#journey{
  position:absolute;
  bottom:9%;
  left:50%;
  transform:translateX(-50%);
  min-width:205px;
  padding:15px 27px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 15px 50px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.2);
  cursor:pointer;
  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease;
}

#journey:active{
  transform:translateX(-50%) scale(.96);
}

#sound{
  position:absolute;
  right:22px;
  bottom:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.14);
  color:#fff;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:10;
  cursor:pointer;
}

#status{
  position:absolute;
  left:50%;
  bottom:3.5%;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  opacity:0;
  transition:opacity .5s ease;
}

#status.show{
  opacity:1;
}

@media(max-width:600px){

  #mark{
    width:52px;
    height:52px;
    border-radius:18px;
    margin-bottom:26px;
  }

  #greeting{
    font-size:48px;
  }

  #message{
    max-width:330px;
    font-size:15px;
  }

  #tagline{
    bottom:23%;
    font-size:8px;
    letter-spacing:.24em;
  }

  #journey{
    bottom:9%;
    min-width:184px;
    padding:14px 22px;
    font-size:10px;
  }

  #time{
    top:6%;
    font-size:7px;
  }
}
</style>
</head>

<body>

<div id="experience">

  <video
    id="backgroundVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div id="atmosphere"></div>
  <div id="grain"></div>

  <div id="interface">

    <div id="time"></div>

    <div id="mark">
      <div id="markCore"></div>
    </div>

    <h1 id="greeting"></h1>

    <p id="message"></p>

    <div id="tagline">
      A Safe Space For Every Mind
    </div>

    <button id="journey">
      Begin Your Journey
    </button>

  </div>

  <button id="sound">♫</button>

  <div id="status">
    Preparing your journey
  </div>

</div>

<script>

const video = document.getElementById("backgroundVideo");
const greeting = document.getElementById("greeting");
const message = document.getElementById("message");
const time = document.getElementById("time");
const journey = document.getElementById("journey");
const sound = document.getElementById("sound");
const statusText = document.getElementById("status");

let activeVideo = "";
let audioEnabled = false;

const videos = {

  morning1:"aksh-morning.1.mov",
  morning2:"aksh-morning.2.mov",
  morning3:"aksh-morning.3.mov",
  morning4:"aksh-morning.4.mov",

  afternoon1:"aksh-afternoon.1.mov",
  afternoon2:"aksh-afternoon.2.mov",
  afternoon3:"aksh-afternoon.3.mov",
  afternoon4:"aksh-afternoon.4.mov",

  evening1:"aksh-evening.1.mov",
  evening2:"aksh-evening.2.mov",
  evening3:"aksh-morning.4.mov",

  night1:"aksh-night.1.mov",
  night2:"aksh-night.2.mov"

};

function experienceForNow(){

  const now = new Date();

  const minutes =
    now.getHours() * 60 +
    now.getMinutes();

  if(minutes >= 300 && minutes < 360){

    return {
      title:"Good Morning 🌅",
      text:"Take a breath. The day is beginning, and you don't have to rush.",
      file:videos.morning1,
      label:"05:00 — 06:00"
    };

  }

  if(minutes >= 360 && minutes < 480){

    return {
      title:"Good Morning 🌅",
      text:"A quiet moment for you. Let the morning arrive gently.",
      file:videos.morning2,
      label:"06:00 — 08:00"
    };

  }

  if(minutes >= 480 && minutes < 600){

    return {
      title:"Good Morning 🌅",
      text:"Slow down for a moment. You deserve a little peace today.",
      file:videos.morning3,
      label:"08:00 — 10:00"
    };

  }

  if(minutes >= 600 && minutes < 720){

    return {
      title:"Good Morning 🌅",
      text:"Before the day gets louder, give yourself a quiet moment.",
      file:videos.morning4,
      label:"10:00 — 11:59"
    };

  }

  if(minutes >= 720 && minutes < 780){

    return {
      title:"Good Afternoon ☀️",
      text:"Pause for a moment. You are allowed to take care of yourself.",
      file:videos.afternoon1,
      label:"12:00 — 01:00"
    };

  }

  if(minutes >= 780 && minutes < 870){

    return {
      title:"Good Afternoon ☀️",
      text:"Let the noise soften. Stay here for a moment.",
      file:videos.afternoon2,
      label:"01:00 — 02:30"
    };

  }

  if(minutes >= 870 && minutes < 960){

    return {
      title:"Good Afternoon ☀️",
      text:"A little stillness can change the way a day feels.",
      file:videos.afternoon3,
      label:"02:30 — 04:00"
    };

  }

  if(minutes >= 960 && minutes < 1020){

    return {
      title:"Good Afternoon ☀️",
      text:"Whatever today has brought you, you don't have to carry it alone.",
      file:videos.afternoon4,
      label:"04:00 — 04:59"
    };

  }

  if(minutes >= 1020 && minutes < 1065){

    return {
      title:"Good Evening 🌆",
      text:"The day is slowing down. Let yourself slow down with it.",
      file:videos.evening1,
      label:"05:00 — 05:45"
    };

  }

  if(minutes >= 1065 && minutes < 1140){

    return {
      title:"Good Evening 🌆",
      text:"Some journeys are easier when you don't have to walk them alone.",
      file:videos.evening2,
      label:"05:45 — 07:00"
    };

  }

  if(minutes >= 1140 && minutes < 1200){

    return {
      title:"Good Evening 🌆",
      text:"Take one last quiet breath before the evening becomes night.",
      file:videos.evening3,
      label:"07:00 — 07:59"
    };

  }

  if(minutes >= 1200){

    return {
      title:"Good Night 🌙",
      text:"The world can wait. For now, give your mind somewhere peaceful to rest.",
      file:videos.night1,
      label:"08:00 PM — 11:59 PM"
    };

  }

  return {
    title:"Good Night 🌙",
    text:"It's quiet now. Breathe slowly. You are safe to pause here.",
    file:videos.night2,
    label:"12:00 AM — 04:59 AM"
  };

}

function loadExperience(){

  const data = experienceForNow();

  greeting.textContent = data.title;
  message.textContent = data.text;
  time.textContent = data.label;

  if(activeVideo === data.file){
    return;
  }

  activeVideo = data.file;

  video.classList.remove("visible");

  video.src = data.file;

  video.load();

  video.addEventListener(
    "canplay",
    function show(){

      video.classList.add("visible");

      video.removeEventListener(
        "canplay",
        show
      );

    }
  );

  video.play().catch(()=>{});

}

sound.addEventListener("click",function(){

  audioEnabled = !audioEnabled;

  if(audioEnabled){

    video.muted = false;
    video.volume = .75;

    video.play().catch(()=>{});

    sound.textContent = "🔊";

  }else{

    video.muted = true;

    sound.textContent = "♫";

  }

});

journey.addEventListener("click",function(){

  statusText.classList.add("show");

  setTimeout(function(){

    statusText.classList.remove("show");

  },1800);

});

loadExperience();

setInterval(function(){

  const current = experienceForNow();

  if(current.file !== activeVideo){

    loadExperience();

  }

},15000);

</script>

</body>
</html>
