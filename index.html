<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AKSH — A Safe Space For Every Mind</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Helvetica Neue",Arial,sans-serif;
}

#page{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#050609;
}

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1.5s ease;
}

#video.show{
  opacity:1;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.20),
    rgba(0,0,0,.02) 40%,
    rgba(0,0,0,.42)
  );
  pointer-events:none;
}

.top{
  position:absolute;
  top:7%;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

#icon{
  width:76px;
  height:76px;
  object-fit:contain;
  margin-bottom:15px;
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.3));
}

#watermark{
  color:rgba(255,255,255,.72);
  font-size:15px;
  letter-spacing:.48em;
  margin-left:.48em;
}

#tagline{
  margin-top:9px;
  color:rgba(255,255,255,.9);
  font-size:11px;
  letter-spacing:.11em;
  white-space:nowrap;
}

#date{
  position:absolute;
  top:5.5%;
  left:5%;
  z-index:5;
  color:rgba(255,255,255,.82);
  font-size:10px;
  letter-spacing:.14em;
}

#day{
  position:absolute;
  top:5.5%;
  right:5%;
  z-index:5;
  color:rgba(255,255,255,.82);
  font-size:10px;
  letter-spacing:.14em;
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
  pointer-events:none;
}

#greeting{
  color:white;
  font-size:clamp(38px,8vw,82px);
  font-weight:300;
  letter-spacing:-.035em;
  text-shadow:0 5px 35px rgba(0,0,0,.42);
}

#journey{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  z-index:6;

  min-width:205px;
  padding:15px 30px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:rgba(255,255,255,.10);
  color:white;

  font-size:10px;
  letter-spacing:.19em;
  text-transform:uppercase;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

#sound{
  position:absolute;
  right:5%;
  bottom:5.5%;
  z-index:8;

  width:43px;
  height:43px;

  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);

  background:rgba(0,0,0,.16);
  color:white;

  font-size:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

#fade{
  position:absolute;
  inset:0;
  background:#050609;
  opacity:0;
  z-index:20;
  pointer-events:none;
  transition:opacity .7s ease;
}

#fade.on{
  opacity:1;
}

@media(max-width:600px){

  .top{
    top:8%;
  }

  #icon{
    width:68px;
    height:68px;
  }

  #watermark{
    font-size:14px;
  }

  #tagline{
    font-size:9px;
  }

  #date,#day{
    top:4.5%;
    font-size:8px;
  }

  #greeting{
    font-size:42px;
  }

  #journey{
    bottom:10%;
    min-width:190px;
  }
}
</style>
</head>

<body>

<div id="page">

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div class="overlay"></div>

  <div id="date"></div>
  <div id="day"></div>

  <div class="top">
    <img id="icon" src="aksh-icon.PNG" alt="AKSH">
    <div id="watermark">AKSH</div>
    <div id="tagline">A Safe Space For Every Mind</div>
  </div>

  <div class="center">
    <div id="greeting"></div>
  </div>

  <button id="journey">
    Begin Your Journey
  </button>

  <button id="sound">
    🔊
  </button>

  <div id="fade"></div>

</div>

<script>

const video = document.getElementById("video");
const greeting = document.getElementById("greeting");
const dateBox = document.getElementById("date");
const dayBox = document.getElementById("day");
const sound = document.getElementById("sound");
const journey = document.getElementById("journey");
const fade = document.getElementById("fade");

const files = {
  morning1:"aksh-morning.1.mov",
  morning2:"aksh-morning.2.mov",
  morning3:"aksh-morning.3.mov",
  morning4:"aksh-morning.4.mov",

  afternoon1:"aksh-afternoon.1.mov",
  afternoon2:"aksh-afternoon.2.mov",
  afternoon3:"aksh-afternoon.3.mov",
  afternoon4:"aksh-afternoon.4.mov",

  evening1:"aksh-evening.1.mov",
  evening2:"aksh-evening.2.mov",
  evening3:"aksh-morning.4.mov",

  night1:"aksh-night.1.mov",
  night2:"aksh-night.2.mov"
};

const now = new Date();

const total =
  now.getHours() * 60 +
  now.getMinutes();

let message;
let selected;

if(total >= 300 && total < 360){
  message="Good Morning";
  selected=files.morning1;
}
else if(total >= 360 && total < 480){
  message="Good Morning";
  selected=files.morning2;
}
else if(total >= 480 && total < 600){
  message="Good Morning";
  selected=files.morning3;
}
else if(total >= 600 && total < 720){
  message="Good Morning";
  selected=files.morning4;
}
else if(total >= 720 && total < 780){
  message="Good Afternoon";
  selected=files.afternoon1;
}
else if(total >= 780 && total < 870){
  message="Good Afternoon";
  selected=files.afternoon2;
}
else if(total >= 870 && total < 960){
  message="Good Afternoon";
  selected=files.afternoon3;
}
else if(total >= 960 && total < 1020){
  message="Good Afternoon";
  selected=files.afternoon4;
}
else if(total >= 1020 && total < 1065){
  message="Good Evening";
  selected=files.evening1;
}
else if(total >= 1065 && total < 1140){
  message="Good Evening";
  selected=files.evening2;
}
else if(total >= 1140 && total < 1200){
  message="Good Evening";
  selected=files.evening3;
}
else if(total >= 1200){
  message="Good Night";
  selected=files.night1;
}
else{
  message="Good Night";
  selected=files.night2;
}

greeting.textContent = message;

dateBox.textContent =
  now.toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).toUpperCase();

dayBox.textContent =
  now.toLocaleDateString("en-IN",{
    weekday:"long"
  }).toUpperCase();

video.src = selected;

video.play().catch(()=>{});

video.addEventListener("canplay",()=>{
  video.classList.add("show");
  video.play().catch(()=>{});
},{once:true});


function openPage1(){

  fade.classList.add("on");

  setTimeout(()=>{
    window.location.replace("page1.html");
  },700);

}


/* BUTTON — IMMEDIATE */
journey.addEventListener("click",openPage1);


/* AUTOMATIC — EXACTLY 4 SECONDS */
setTimeout(openPage1,4000);


/*
  SOUND CONTROL

  iPhone/Safari may block automatic
  audible autoplay. The video itself
  therefore starts muted so it can autoplay.
  Tapping the sound button enables sound.
*/

sound.addEventListener("click",()=>{

  video.muted = !video.muted;

  if(video.muted){

    sound.textContent="🔇";

  }else{

    sound.textContent="🔊";

    video.volume=1;

    video.play().catch(()=>{});

  }

});

</script>

</body>
</html>
