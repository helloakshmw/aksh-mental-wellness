<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#050609"
>

<title>AKSH — A Safe Space For Every Mind</title>

<style>

/* =========================================================
   AKSH — ARRIVAL EXPERIENCE
   ========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}


/* =========================================================
   FULL SCREEN
   ========================================================= */

#page{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#050609;

  isolation:isolate;
}


/* =========================================================
   VIDEO
   ========================================================= */

#video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  background:#050609;

  opacity:0;

  transform:scale(1.04);

  transition:
    opacity 1.25s ease,
    transform 5s cubic-bezier(.2,.7,.2,1);

  z-index:1;
}

#video.show{
  opacity:1;
  transform:scale(1);
}


/* =========================================================
   CINEMATIC OVERLAY
   ========================================================= */

.overlay{
  position:absolute;
  inset:0;

  z-index:2;

  pointer-events:none;

  background:

    linear-gradient(
      180deg,
      rgba(0,0,0,.48) 0%,
      rgba(0,0,0,.08) 28%,
      rgba(0,0,0,.05) 52%,
      rgba(0,0,0,.48) 100%
    );
}


/* Cinematic vignette */

.vignette{
  position:absolute;
  inset:-5%;

  z-index:3;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 34%,
      rgba(0,0,0,.20) 68%,
      rgba(0,0,0,.55) 100%
    );
}


/* =========================================================
   TOP BRAND
   ========================================================= */

.top{
  position:absolute;

  top:
    max(
      25px,
      env(safe-area-inset-top)
    );

  left:50%;

  transform:translateX(-50%);

  z-index:10;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  pointer-events:none;
}


/* AKSH ICON */

#icon{
  width:68px;
  height:68px;

  object-fit:contain;

  margin-bottom:8px;

  filter:
    drop-shadow(
      0 12px 30px
      rgba(0,0,0,.38)
    );
}


/* AKSH */

#watermark{
  color:
    rgba(255,255,255,.94);

  font-size:14px;

  font-weight:400;

  letter-spacing:.50em;

  margin-left:.50em;
}


/* TAGLINE */

#tagline{
  margin-top:7px;

  color:
    rgba(255,255,255,.78);

  font-size:9px;

  font-weight:400;

  letter-spacing:.13em;

  white-space:nowrap;
}


/* =========================================================
   DATE — TOP LEFT
   ========================================================= */

#date{
  position:absolute;

  top:
    max(
      28px,
      env(safe-area-inset-top)
    );

  left:
    max(
      25px,
      env(safe-area-inset-left)
    );

  z-index:10;

  color:
    rgba(255,255,255,.92);

  font-size:12px;

  font-weight:400;

  letter-spacing:.08em;

  white-space:nowrap;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.35);
}


/* =========================================================
   DAY — UNDER DATE
   ========================================================= */

#day{
  position:absolute;

  top:
    calc(
      max(
        28px,
        env(safe-area-inset-top)
      ) + 21px
    );

  left:
    max(
      25px,
      env(safe-area-inset-left)
    );

  z-index:10;

  color:
    rgba(255,255,255,.78);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:14px;

  font-style:italic;

  letter-spacing:.04em;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.35);
}


/* =========================================================
   CENTER CONTENT
   ========================================================= */

.center{
  position:absolute;

  inset:0;

  z-index:6;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
    130px 25px 150px;

  pointer-events:none;
}


/* =========================================================
   GREETING
   ========================================================= */

#greeting{
  color:#fff;

  /*
    BIG HERO TEXT
  */

  font-size:
    clamp(
      58px,
      9vw,
      120px
    );

  line-height:.98;

  font-weight:300;

  letter-spacing:-.055em;

  white-space:nowrap;

  text-shadow:
    0 7px 38px
    rgba(0,0,0,.48);

  margin-bottom:24px;

  animation:
    greetingIn 1.1s
    cubic-bezier(.2,.7,.2,1)
    both;
}


/* =========================================================
   QUOTE
   ========================================================= */

#quote{
  max-width:
    min(
      720px,
      86vw
    );

  color:
    rgba(255,255,255,.90);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      15px,
      1.7vw,
      23px
    );

  line-height:1.45;

  font-weight:400;

  font-style:italic;

  letter-spacing:.01em;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.50);

  animation:
    quoteIn 1.3s
    .15s
    cubic-bezier(.2,.7,.2,1)
    both;
}


/* =========================================================
   TEXT ANIMATIONS
   ========================================================= */

@keyframes greetingIn{

  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


@keyframes quoteIn{

  from{
    opacity:0;
    transform:
      translateY(12px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}


/* =========================================================
   BEGIN YOUR JOURNEY
   ========================================================= */

#journey{
  position:absolute;

  left:50%;

  bottom:
    max(
      78px,
      calc(
        62px +
        env(safe-area-inset-bottom)
      )
    );

  transform:
    translateX(-50%);

  z-index:12;

  min-width:235px;

  min-height:54px;

  padding:
    0 28px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:24px;

  border:
    1px solid
    rgba(255,255,255,.52);

  border-radius:999px;

  background:
    rgba(0,0,0,.16);

  color:#fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  font-size:10px;

  font-weight:400;

  letter-spacing:.20em;

  text-transform:uppercase;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

  transition:
    background .35s ease,
    border-color .35s ease,
    transform .35s ease;
}


#journey::after{

  content:"→";

  color:
    rgba(230,194,122,.95);

  font-size:21px;

  line-height:1;

  transition:
    transform .35s ease;
}


#journey:hover{

  background:
    rgba(255,255,255,.13);

  border-color:
    rgba(255,255,255,.82);

}


#journey:hover::after{

  transform:
    translateX(5px);

}


#journey:active{

  transform:
    translateX(-50%)
    scale(.96);

}


/* =========================================================
   SOUND BUTTON
   ========================================================= */

#sound{
  position:absolute;

  right:
    max(
      25px,
      env(safe-area-inset-right)
    );

  bottom:
    max(
      25px,
      env(safe-area-inset-bottom)
    );

  z-index:15;

  width:46px;
  height:46px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.42);

  background:
    rgba(0,0,0,.20);

  color:#fff;

  font-size:17px;

  display:flex;

  align-items:center;

  justify-content:center;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

  transition:
    transform .25s ease,
    background .25s ease;
}


#sound:active{

  transform:scale(.91);

}


#sound.on{

  background:
    rgba(255,255,255,.15);

}


/* =========================================================
   FADE TRANSITION
   ========================================================= */

#fade{
  position:absolute;

  inset:0;

  background:#050609;

  opacity:0;

  z-index:30;

  pointer-events:none;

  transition:
    opacity .85s
    cubic-bezier(.65,0,.35,1);
}


#fade.on{
  opacity:1;
}


/* =========================================================
   SMALL LOADING STATE
   ========================================================= */

#loader{
  position:absolute;

  left:50%;
  top:50%;

  width:28px;
  height:28px;

  transform:
    translate(-50%,-50%);

  z-index:5;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-top-color:
    rgba(255,255,255,.82);

  border-radius:50%;

  animation:
    spin .9s linear infinite;

  transition:
    opacity .5s ease;
}


#loader.hide{
  opacity:0;
}


@keyframes spin{

  to{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}


/* =========================================================
   TABLET
   ========================================================= */

@media
(min-width:601px)
and
(max-width:1199px){

  #greeting{

    font-size:
      clamp(
        55px,
        9vw,
        95px
      );

  }

  #quote{

    font-size:
      clamp(
        16px,
        2vw,
        21px
      );

  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .overlay{

    background:

      linear-gradient(
        180deg,
        rgba(0,0,0,.53) 0%,
        rgba(0,0,0,.08) 30%,
        rgba(0,0,0,.10) 53%,
        rgba(0,0,0,.53) 100%
      );

  }


  .top{

    top:
      max(
        20px,
        env(safe-area-inset-top)
      );

  }


  #icon{

    width:52px;
    height:52px;

    margin-bottom:6px;

  }


  #watermark{

    font-size:12px;

    letter-spacing:.43em;

    margin-left:.43em;

  }


  #tagline{

    font-size:7px;

    letter-spacing:.09em;

  }


  #date{

    top:
      max(
        23px,
        env(safe-area-inset-top)
      );

    left:
      max(
        18px,
        env(safe-area-inset-left)
      );

    font-size:10px;

    letter-spacing:.06em;

  }


  #day{

    top:
      calc(
        max(
          23px,
          env(safe-area-inset-top)
        ) + 18px
      );

    left:
      max(
        18px,
        env(safe-area-inset-left)
      );

    font-size:13px;

  }


  .center{

    padding:
      150px 18px 155px;

  }


  /*
    IMPORTANT:
    Large enough to be the hero,
    but responsive enough to stay
    on ONE LINE on modern phones.
  */

  #greeting{

    font-size:
      clamp(
        40px,
        10.8vw,
        67px
      );

    letter-spacing:-.065em;

    margin-bottom:18px;

    white-space:nowrap;

  }


  #quote{

    max-width:88vw;

    font-size:
      clamp(
        13px,
        3.7vw,
        17px
      );

    line-height:1.42;

  }


  #journey{

    bottom:
      max(
        76px,
        calc(
          62px +
          env(safe-area-inset-bottom)
        )
      );

    min-width:210px;

    min-height:51px;

    padding:
      0 22px;

    gap:19px;

    font-size:9px;

    letter-spacing:.16em;

  }


  #sound{

    right:
      max(
        18px,
        env(safe-area-inset-right)
      );

    bottom:
      max(
        19px,
        env(safe-area-inset-bottom)
      );

    width:42px;
    height:42px;

    font-size:15px;

  }

}


/* =========================================================
   VERY SMALL PHONE
   ========================================================= */

@media(max-width:380px){

  #greeting{

    font-size:
      clamp(
        34px,
        10.5vw,
        46px
      );

  }


  #quote{

    font-size:13px;

  }


  #journey{

    min-width:195px;

    min-height:48px;

    font-size:8px;

  }

}


/* =========================================================
   SHORT SCREEN
   ========================================================= */

@media(max-height:700px){

  .center{

    padding-top:110px;
    padding-bottom:130px;

  }


  #greeting{

    margin-bottom:14px;

  }


  #journey{

    bottom:60px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  #video{

    transition:none;

    transform:none;

  }

  #greeting,
  #quote{

    animation:none;

  }

  #fade{

    transition:none;

  }

}

</style>

</head>


<body>


<div id="page">


  <!-- =====================================================
       VIDEO
       ===================================================== -->

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback
  ></video>


  <!-- Cinematic overlay -->

  <div class="overlay"></div>

  <div class="vignette"></div>


  <!-- Loading -->

  <div id="loader"></div>


  <!-- =====================================================
       DATE + DAY
       ===================================================== -->

  <div id="date"></div>

  <div id="day"></div>


  <!-- =====================================================
       AKSH BRAND
       ===================================================== -->

  <div class="top">

    <img
      id="icon"
      src="aksh-icon.PNG"
      alt="AKSH"
    >

    <div id="watermark">
      AKSH
    </div>

    <div id="tagline">
      A Safe Space For Every Mind
    </div>

  </div>


  <!-- =====================================================
       CENTER HERO
       ===================================================== -->

  <div class="center">

    <div id="greeting"></div>

    <div id="quote"></div>

  </div>


  <!-- =====================================================
       BEGIN JOURNEY
       ===================================================== -->

  <button
    id="journey"
    type="button"
  >
    Begin Your Journey
  </button>


  <!-- =====================================================
       SOUND
       ===================================================== -->

  <button
    id="sound"
    type="button"
    aria-label="Turn sound on"
  >
    🔇
  </button>


  <!-- =====================================================
       PAGE TRANSITION
       ===================================================== -->

  <div id="fade"></div>


</div>


<script>

/* =========================================================
   AKSH ARRIVAL ENGINE
   ========================================================= */


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const video =
  document.getElementById("video");

const greeting =
  document.getElementById("greeting");

const quote =
  document.getElementById("quote");

const dateBox =
  document.getElementById("date");

const dayBox =
  document.getElementById("day");

const sound =
  document.getElementById("sound");

const journey =
  document.getElementById("journey");

const fade =
  document.getElementById("fade");

const loader =
  document.getElementById("loader");


/* ---------------------------------------------------------
   ALL 13 VIDEOS
   --------------------------------------------------------- */

const files = {

  morning1:
    "aksh-morning.1.mov",

  morning2:
    "aksh-morning.2.mov",

  morning3:
    "aksh-morning.3.mov",

  morning4:
    "aksh-morning.4.mov",


  afternoon1:
    "aksh-afternoon.1.mov",

  afternoon2:
    "aksh-afternoon.2.mov",

  afternoon3:
    "aksh-afternoon.3.mov",

  afternoon4:
    "aksh-afternoon.4.mov",


  evening1:
    "aksh-evening.1.mov",

  evening2:
    "aksh-evening.2.mov",

  evening3:
    "aksh-evening.3.mov",


  night1:
    "aksh-night.1.mov",

  night2:
    "aksh-night.2.mov"

};


/* ---------------------------------------------------------
   QUOTE LIBRARY
   --------------------------------------------------------- */

const quotes = {

  morning: [

    "Come as you are.",

    "Begin gently. The day can wait.",

    "Take a breath. There is time.",

    "Let today meet you exactly as you are.",

    "You do not have to rush into the day.",

    "Start with one peaceful thought.",

    "You are allowed to move slowly.",

    "A new morning is another chance to begin.",

    "You don't need to have everything figured out today.",

    "Give yourself permission to simply begin.",

    "Let the morning be kind to you.",

    "There is no perfect way to begin a day."

  ],


  afternoon: [

    "Pause for a moment. Notice where you are.",

    "You are allowed to pause in the middle of everything.",

    "Take a breath before taking the next step.",

    "There is still time to choose yourself.",

    "You don't have to carry everything at once.",

    "Your wellbeing belongs in the middle of your day too.",

    "Not every moment needs an answer.",

    "You are more than what you accomplish today.",

    "Pause. Breathe. Continue when you are ready.",

    "Whatever today feels like, you can meet it gently.",

    "A quiet moment can change the rest of a day.",

    "You are allowed to make space for yourself."

  ],


  evening: [

    "Let the day become quieter.",

    "You have made it this far. Breathe.",

    "The day does not need to end perfectly.",

    "Leave some space for yourself tonight.",

    "You can put down what no longer needs carrying.",

    "Let yourself arrive here.",

    "You deserve a moment without expectations.",

    "Slow down. You are safe to pause.",

    "The evening is allowed to be gentle.",

    "Somewhere between today and tomorrow, there is rest.",

    "Let the noise of the day soften.",

    "You can finish today without finishing everything."

  ],


  night: [

    "Nothing needs to be solved tonight.",

    "Rest is also a form of moving forward.",

    "Tomorrow can wait.",

    "You have permission to rest.",

    "The night does not ask anything from you.",

    "Breathe. You have done enough for today.",

    "Some answers arrive after we stop searching.",

    "Close the day gently.",

    "You can simply be here.",

    "Let your mind become quiet, one breath at a time.",

    "Tonight, you don't have to be anything for anyone.",

    "It is okay to let today go."

  ]

};


/* ---------------------------------------------------------
   CURRENT TIME
   --------------------------------------------------------- */

const now =
  new Date();

const total =
  now.getHours() * 60 +
  now.getMinutes();


/* ---------------------------------------------------------
   TIME SELECTION
   --------------------------------------------------------- */

let period;

let message;

let selected;


/* =========================================================
   GOOD MORNING
   5:00 AM — 11:59 AM
   ========================================================= */

if(
  total >= 300 &&
  total < 360
){

  period = "morning";

  message =
    "Good Morning";

  selected =
    files.morning1;

}

else if(
  total >= 360 &&
  total < 480
){

  period = "morning";

  message =
    "Good Morning";

  selected =
    files.morning2;

}

else if(
  total >= 480 &&
  total < 600
){

  period = "morning";

  message =
    "Good Morning";

  selected =
    files.morning3;

}

else if(
  total >= 600 &&
  total < 720
){

  period = "morning";

  message =
    "Good Morning";

  selected =
    files.morning4;

}


/* =========================================================
   GOOD AFTERNOON
   12:00 PM — 4:59 PM
   ========================================================= */

else if(
  total >= 720 &&
  total < 780
){

  period = "afternoon";

  message =
    "Good Afternoon";

  selected =
    files.afternoon1;

}

else if(
  total >= 780 &&
  total < 870
){

  period = "afternoon";

  message =
    "Good Afternoon";

  selected =
    files.afternoon2;

}

else if(
  total >= 870 &&
  total < 960
){

  period = "afternoon";

  message =
    "Good Afternoon";

  selected =
    files.afternoon3;

}

else if(
  total >= 960 &&
  total < 1020
){

  period = "afternoon";

  message =
    "Good Afternoon";

  selected =
    files.afternoon4;

}


/* =========================================================
   GOOD EVENING
   5:00 PM — 7:59 PM
   ========================================================= */

else if(
  total >= 1020 &&
  total < 1065
){

  period = "evening";

  message =
    "Good Evening";

  selected =
    files.evening1;

}

else if(
  total >= 1065 &&
  total < 1140
){

  period = "evening";

  message =
    "Good Evening";

  selected =
    files.evening2;

}

else if(
  total >= 1140 &&
  total < 1200
){

  period = "evening";

  message =
    "Good Evening";

  selected =
    files.evening3;

}


/* =========================================================
   GOOD NIGHT
   8:00 PM — 4:59 AM
   ========================================================= */

else if(
  total >= 1200
){

  period = "night";

  message =
    "Good Night";

  selected =
    files.night1;

}

else{

  period = "night";

  message =
    "Good Night";

  selected =
    files.night2;

}


/* ---------------------------------------------------------
   SET GREETING
   --------------------------------------------------------- */

greeting.textContent =
  message;


/* ---------------------------------------------------------
   DATE
   EXACT FORMAT:

   14.08.2026

   --------------------------------------------------------- */

const dayNumber =
  String(
    now.getDate()
  ).padStart(2,"0");

const monthNumber =
  String(
    now.getMonth() + 1
  ).padStart(2,"0");

const yearNumber =
  now.getFullYear();


dateBox.textContent =
  `${dayNumber}.${monthNumber}.${yearNumber}`;


/* ---------------------------------------------------------
   DAY

   Friday
   --------------------------------------------------------- */

dayBox.textContent =
  now.toLocaleDateString(
    "en-IN",
    {
      weekday:"long"
    }
  );


/* ---------------------------------------------------------
   DIFFERENT QUOTE
   --------------------------------------------------------- */

const quoteList =
  quotes[period];


/*
  Random selection.

  Every visitor can receive
  a different quote.

  The list is intentionally
  large so repeated visits
  have many possibilities.
*/

const randomQuote =
  quoteList[
    Math.floor(
      Math.random() *
      quoteList.length
    )
  ];


quote.textContent =
  randomQuote;


/* ---------------------------------------------------------
   LOAD VIDEO
   --------------------------------------------------------- */

video.src =
  selected;


/* ---------------------------------------------------------
   START VIDEO
   --------------------------------------------------------- */

function startVideo(){

  video.muted =
    true;

  video.setAttribute(
    "muted",
    ""
  );

  video.setAttribute(
    "playsinline",
    ""
  );

  video.setAttribute(

  ){

    );

/* =========================================================
   SOUND
   ========================================================= */

let soundOn =
  false;


sound.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();


    if(
      soundOn
    ){

      video.muted =
        true;

      soundOn =
        false;

      sound.textContent =
        "🔇";

      sound.classList.remove(
        "on"
      );

      sound.setAttribute(
        "aria-label",
        "Turn sound on"
      );

      return;

    }


    /*
      This tap is a real user
      interaction, allowing the
      browser to enable audio.
    */

    video.muted =
      false;

    video.volume =
      1;


    const playPromise =
      video.play();


    if(
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        () => {

          video.muted =
            true;

          soundOn =
            false;

          sound.textContent =
            "🔇";

        }
      );

    }


    soundOn =
      true;

    sound.textContent =
      "🔊";

    sound.classList.add(
      "on"
    );

    sound.setAttribute(
      "aria-label",
      "Turn sound off"
    );

  }
);
