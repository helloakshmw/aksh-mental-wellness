<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>AKSH — A Safe Space For Every Mind</title>

<style>

/* =========================================================
   AKSH — 00 ARRIVAL
   ========================================================= */

:root{
  --white:#ffffff;
  --soft:rgba(255,255,255,.82);
  --muted:rgba(255,255,255,.58);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
}

body{
  color:#fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button{
  font:inherit;
  border:0;
  outline:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   ARRIVAL
   ========================================================= */

#arrival{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
}

/* =========================================================
   VIDEO
   ========================================================= */

#arrival-video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  background:#05070c;

  opacity:0;

  transform:scale(1.035);

  transition:
    opacity 1.2s ease,
    transform 8s cubic-bezier(.16,1,.3,1);
}

#arrival-video.visible{
  opacity:1;
  transform:scale(1);
}

/* =========================================================
   CINEMATIC OVERLAYS
   ========================================================= */

.video-dark{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.44) 0%,
      rgba(0,0,0,.08) 28%,
      rgba(0,0,0,.03) 55%,
      rgba(0,0,0,.50) 100%
    );
}

.video-vignette{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0,0,0,.18) 72%,
      rgba(0,0,0,.55) 100%
    );
}

.video-film{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;

  opacity:.10;

  background:
    linear-gradient(
      rgba(255,255,255,.015) 50%,
      rgba(0,0,0,.015) 50%
    );

  background-size:100% 4px;

  mix-blend-mode:overlay;
}

/* =========================================================
   TOP DATE
   ========================================================= */

.top-date{
  position:absolute;

  top:max(24px,env(safe-area-inset-top));
  left:clamp(20px,5vw,60px);

  z-index:10;

  display:flex;
  flex-direction:column;

  gap:5px;

  text-transform:uppercase;

  pointer-events:none;
}

.top-date-day{
  font-size:9px;
  letter-spacing:.23em;
  color:rgba(255,255,255,.75);
}

.top-date-date{
  font-size:8px;
  letter-spacing:.18em;
  color:rgba(255,255,255,.48);
}

/* =========================================================
   TOP TIME
   ========================================================= */

.top-time{
  position:absolute;

  top:max(24px,env(safe-area-inset-top));
  right:clamp(20px,5vw,60px);

  z-index:10;

  text-align:right;

  pointer-events:none;
}

.top-time-clock{
  font-size:9px;
  letter-spacing:.22em;
  color:rgba(255,255,255,.75);
}

.top-time-period{
  margin-top:5px;

  font-size:8px;
  letter-spacing:.18em;

  color:rgba(255,255,255,.46);
}

/* =========================================================
   AKSH BRAND
   ========================================================= */

.brand{
  position:absolute;

  top:max(24px,env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  z-index:10;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  pointer-events:none;
}

.brand-icon{
  width:clamp(48px,6vw,76px);
  height:clamp(48px,6vw,76px);

  object-fit:contain;

  filter:
    drop-shadow(
      0 10px 30px rgba(0,0,0,.35)
    );

  margin-bottom:8px;
}

.brand-name{
  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:clamp(15px,2vw,21px);

  letter-spacing:.30em;
  margin-left:.30em;

  color:rgba(255,255,255,.95);
}

.brand-tagline{
  margin-top:5px;

  font-size:clamp(6px,.8vw,9px);

  letter-spacing:.18em;

  color:rgba(255,255,255,.70);

  white-space:nowrap;
}

/* =========================================================
   CENTER
   ========================================================= */

.center{
  position:absolute;
  inset:0;

  z-index:8;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  pointer-events:none;

  padding:100px 24px 140px;
}

.greeting{
  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:clamp(46px,8vw,100px);

  line-height:.92;

  font-weight:400;

  letter-spacing:-.045em;

  text-shadow:
    0 10px 45px rgba(0,0,0,.40);

  animation:
    greetingIn 1.5s cubic-bezier(.16,1,.3,1) both;
}

.greeting-sub{
  margin-top:18px;

  max-width:470px;

  font-size:clamp(11px,1.2vw,15px);

  line-height:1.7;

  letter-spacing:.03em;

  color:rgba(255,255,255,.78);

  text-shadow:
    0 5px 25px rgba(0,0,0,.40);

  animation:
    greetingSubIn 1.8s .15s cubic-bezier(.16,1,.3,1) both;
}

@keyframes greetingIn{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes greetingSubIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =========================================================
   LOADING
   ========================================================= */

.loading{
  position:absolute;
  inset:0;

  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;

  opacity:1;

  transition:opacity 1s ease;
}

.loading.hidden{
  opacity:0;
}

.loading-line{
  width:70px;
  height:1px;

  overflow:hidden;

  background:rgba(255,255,255,.16);
}

.loading-line::after{
  content:"";

  display:block;

  width:35%;
  height:100%;

  background:rgba(255,255,255,.75);

  animation:
    loadingMove 1.2s ease-in-out infinite;
}

@keyframes loadingMove{

  0%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(400%);
  }

}

/* =========================================================
   BOTTOM
   ========================================================= */

.bottom{
  position:absolute;

  left:clamp(20px,5vw,60px);
  right:clamp(20px,5vw,60px);

  bottom:max(25px,env(safe-area-inset-bottom));

  z-index:12;

  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:20px;
}

/* =========================================================
   BEGIN BUTTON
   ========================================================= */

.begin-button{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;

  min-width:clamp(190px,22vw,245px);

  min-height:50px;

  padding:14px 24px;

  border:
    1px solid rgba(255,255,255,.40);

  border-radius:999px;

  color:#fff;

  background:
    rgba(255,255,255,.10);

  backdrop-filter:
    blur(20px)
    saturate(120%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(120%);

  box-shadow:
    0 15px 50px rgba(0,0,0,.20);

  font-size:9px;

  letter-spacing:.20em;

  text-transform:uppercase;

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease;
}

.begin-button:hover{
  transform:translateY(-3px);

  background:
    rgba(255,255,255,.17);

  border-color:
    rgba(255,255,255,.62);
}

.begin-button:active{
  transform:scale(.97);
}

.begin-arrow{
  font-size:17px;
  line-height:1;
}

/* =========================================================
   SOUND
   ========================================================= */

.sound-button{
  width:50px;
  height:50px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.34);

  color:#fff;

  background:
    rgba(0,0,0,.16);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  font-size:16px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.20);

  transition:
    transform .3s ease,
    background .3s ease;
}

.sound-button:hover{
  transform:scale(1.05);

  background:
    rgba(255,255,255,.12);
}

.sound-button:active{
  transform:scale(.94);
}

/* =========================================================
   PAGE TRANSITION
   ========================================================= */

#page-transition{
  position:fixed;
  inset:0;

  z-index:100;

  background:#05070c;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .8s cubic-bezier(.16,1,.3,1);
}

#page-transition.active{
  opacity:1;
}

/* =========================================================
   DESKTOP
   ========================================================= */

@media(min-width:901px){

  .bottom{
    align-items:center;
  }

  .sound-button{
    width:46px;
    height:46px;
  }

}

/* =========================================================
   TABLET
   ========================================================= */

@media(min-width:601px) and (max-width:900px){

  .brand-icon{
    width:62px;
    height:62px;
  }

  .greeting{
    font-size:clamp(55px,9vw,85px);
  }

}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .top-date{
    top:max(18px,env(safe-area-inset-top));
    left:18px;
  }

  .top-time{
    top:max(18px,env(safe-area-inset-top));
    right:18px;
  }

  .top-date-day,
  .top-time-clock{
    font-size:8px;
  }

  .top-date-date,
  .top-time-period{
    font-size:7px;
  }

  .brand{
    top:max(17px,env(safe-area-inset-top));
  }

  .brand-icon{
    width:50px;
    height:50px;

    margin-bottom:5px;
  }

  .brand-name{
    font-size:14px;
  }

  .brand-tagline{
    font-size:6px;
    letter-spacing:.14em;
  }

  .center{
    padding:120px 20px 130px;
  }

  .greeting{
    font-size:clamp(46px,13vw,70px);
  }

  .greeting-sub{
    max-width:300px;

    margin-top:15px;

    font-size:11px;
  }

  .bottom{
    left:18px;
    right:18px;

    bottom:max(18px,env(safe-area-inset-bottom));
  }

  .begin-button{
    min-width:0;

    width:calc(100% - 64px);

    min-height:48px;

    padding:13px 17px;

    font-size:8px;

    letter-spacing:.17em;
  }

  .sound-button{
    width:48px;
    height:48px;
  }

}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:380px){

  .top-date-day,
  .top-time-clock{
    font-size:7px;
  }

  .top-date-date,
  .top-time-period{
    display:none;
  }

  .brand-icon{
    width:44px;
    height:44px;
  }

  .brand-name{
    font-size:13px;
  }

  .brand-tagline{
    display:none;
  }

  .greeting{
    font-size:43px;
  }

  .greeting-sub{
    font-size:10px;
  }

  .begin-button{
    font-size:7px;
  }

}

/* =========================================================
   LANDSCAPE MOBILE
   ========================================================= */

@media(max-height:500px) and (orientation:landscape){

  .brand{
    top:10px;
  }

  .brand-icon{
    width:38px;
    height:38px;
  }

  .brand-name{
    font-size:11px;
  }

  .brand-tagline{
    display:none;
  }

  .top-date,
  .top-time{
    top:12px;
  }

  .center{
    padding:60px 20px 80px;
  }

  .greeting{
    font-size:48px;
  }

  .greeting-sub{
    margin-top:8px;
    font-size:9px;
  }

  .bottom{
    bottom:12px;
  }

  .begin-button,
  .sound-button{
    min-height:40px;
    height:40px;
  }

  .sound-button{
    width:40px;
  }

}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>
</head>


<body>

<div id="arrival">

  <!-- =====================================================
       VIDEO
       ===================================================== -->

  <video
    id="arrival-video"
    playsinline
    webkit-playsinline
    autoplay
    muted
    preload="auto"
    disablepictureinpicture
    disableremoteplayback
  ></video>


  <!-- =====================================================
       CINEMATIC LAYERS
       ===================================================== -->

  <div class="video-dark"></div>
  <div class="video-vignette"></div>
  <div class="video-film"></div>


  <!-- =====================================================
       DATE
       ===================================================== -->

  <div class="top-date">

    <div
      class="top-date-day"
      id="day"
    ></div>

    <div
      class="top-date-date"
      id="date"
    ></div>

  </div>


  <!-- =====================================================
       TIME
       ===================================================== -->

  <div class="top-time">

    <div
      class="top-time-clock"
      id="clock"
    ></div>

    <div
      class="top-time-period"
      id="period"
    ></div>

  </div>


  <!-- =====================================================
       AKSH BRAND
       ===================================================== -->

  <div class="brand">

    <img
      class="brand-icon"
      src="aksh-icon.PNG"
      alt="AKSH"
    >

    <div class="brand-name">
      AKSH
    </div>

    <div class="brand-tagline">
      A SAFE SPACE FOR EVERY MIND
    </div>

  </div>


  <!-- =====================================================
       CENTER
       ===================================================== -->

  <main class="center">

    <h1
      class="greeting"
      id="greeting"
    ></h1>

    <p
      class="greeting-sub"
      id="greeting-sub"
    ></p>

  </main>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    class="loading"
    id="loading"
  >

    <div class="loading-line"></div>

  </div>


  <!-- =====================================================
       BOTTOM
       ===================================================== -->

  <div class="bottom">

    <button
      class="begin-button"
      id="begin-button"
      type="button"
    >

      <span>
        BEGIN YOUR JOURNEY
      </span>

      <span class="begin-arrow">
        →
      </span>

    </button>


    <button
      class="sound-button"
      id="sound-button"
      type="button"
      aria-label="Turn sound on"
    >

      <span id="sound-icon">
        🔇
      </span>

    </button>

  </div>


  <!-- =====================================================
       PAGE TRANSITION
       ===================================================== -->

  <div id="page-transition"></div>

</div>


<script>

/* =========================================================
   AKSH — 00 ARRIVAL ENGINE
   FINAL VERSION
   ========================================================= */


/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
  document.getElementById("arrival-video");

const greeting =
  document.getElementById("greeting");

const greetingSub =
  document.getElementById("greeting-sub");

const dayBox =
  document.getElementById("day");

const dateBox =
  document.getElementById("date");

const clockBox =
  document.getElementById("clock");

const periodBox =
  document.getElementById("period");

const soundButton =
  document.getElementById("sound-button");

const soundIcon =
  document.getElementById("sound-icon");

const beginButton =
  document.getElementById("begin-button");

const transition =
  document.getElementById("page-transition");

const loading =
  document.getElementById("loading");


/* =========================================================
   EXACT AKSH VIDEO LIBRARY
   ========================================================= */

const videos = {

  morning:[
    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov"
  ],

  afternoon:[
    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov"
  ],

  evening:[
    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov"
  ],

  night:[
    "aksh-night.1.mov",
    "aksh-night.2.mov"
  ]

};


/* =========================================================
   GET CURRENT MINUTES
   ========================================================= */

function getTimeMinutes(){

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );

}


/* =========================================================
   SELECT EXACT EXPERIENCE
   ========================================================= */

function getExperience(){

  const minutes =
    getTimeMinutes();


  /* =======================================================
     12:00 AM — 4:59 AM
     GOOD NIGHT — VIDEO 2
     ======================================================= */

  if(minutes >= 0 && minutes < 300){

    return{

      id:"night-2",

      period:"night",

      greeting:"Good Night",

      sub:
        "The world is quiet. You can be quiet too.",

      video:
        videos.night[1]

    };

  }


  /* =======================================================
     5:00 AM — 5:59 AM
     GOOD MORNING — VIDEO 1
     ======================================================= */

  if(minutes >= 300 && minutes < 360){

    return{

      id:"morning-1",

      period:"morning",

      greeting:"Good Morning",

      sub:
        "Take a breath. Let the day arrive gently.",

      video:
        videos.morning[0]

    };

  }


  /* =======================================================
     6:00 AM — 7:59 AM
     GOOD MORNING — VIDEO 2
     ======================================================= */

  if(minutes >= 360 && minutes < 480){

    return{

      id:"morning-2",

      period:"morning",

      greeting:"Good Morning",

      sub:
        "There is no need to rush this moment.",

      video:
        videos.morning[1]

    };

  }


  /* =======================================================
     8:00 AM — 9:59 AM
     GOOD MORNING — VIDEO 3
     ======================================================= */

  if(minutes >= 480 && minutes < 600){

    return{

      id:"morning-3",

      period:"morning",

      greeting:"Good Morning",

      sub:
        "A quiet moment can change the way a day feels.",

      video:
        videos.morning[2]

    };

  }


  /* =======================================================
     10:00 AM — 11:59 AM
     GOOD MORNING — VIDEO 4
     ======================================================= */

  if(minutes >= 600 && minutes < 720){

    return{

      id:"morning-4",

      period:"morning",

      greeting:"Good Morning",

      sub:
        "Make some space for yourself today.",

      video:
        videos.morning[3]

    };

  }


  /* =======================================================
     12:00 PM — 12:59 PM
     GOOD AFTERNOON — VIDEO 1
     ======================================================= */

  if(minutes >= 720 && minutes < 780){

    return{

      id:"afternoon-1",

      period:"afternoon",

      greeting:"Good Afternoon",

      sub:
        "Pause for a moment. You have time.",

      video:
        videos.afternoon[0]

    };

  }


  /* =======================================================
     1:00 PM — 2:29 PM
     GOOD AFTERNOON — VIDEO 2
     ======================================================= */

  if(minutes >= 780 && minutes < 870){

    return{

      id:"afternoon-2",

      period:"afternoon",

      greeting:"Good Afternoon",

      sub:
        "Let the warmth of this moment slow you down.",

      video:
        videos.afternoon[1]

    };

  }


  /* =======================================================
     2:30 PM — 3:59 PM
     GOOD AFTERNOON — VIDEO 3
     ======================================================= */

  if(minutes >= 870 && minutes < 960){

    return{

      id:"afternoon-3",

      period:"afternoon",

      greeting:"Good Afternoon",

      sub:
        "You don't have to carry everything at once.",

      video:
        videos.afternoon[2]

    };

  }


  /* =======================================================
     4:00 PM — 4:59 PM
     GOOD AFTERNOON — VIDEO 4
     ======================================================= */

  if(minutes >= 960 && minutes < 1020){

    return{

      id:"afternoon-4",

      period:"afternoon",

      greeting:"Good Afternoon",

      sub:
        "Take a breath before the day moves on.",

      video:
        videos.afternoon[3]

    };

  }


  /* =======================================================
     5:00 PM — 5:44 PM
     GOOD EVENING — VIDEO 1
     ======================================================= */

  if(minutes >= 1020 && minutes < 1065){

    return{

      id:"evening-1",

      period:"evening",

      greeting:"Good Evening",

      sub:
        "Let the day soften around you.",

      video:
        videos.evening[0]

    };

  }


  /* =======================================================
     5:45 PM — 6:59 PM
     GOOD EVENING — VIDEO 2
     ======================================================= */

  if(minutes >= 1065 && minutes < 1140){

    return{

      id:"evening-2",

      period:"evening",

      greeting:"Good Evening",

      sub:
        "You can leave some of the day behind.",

      video:
        videos.evening[1]

    };

  }


  /* =======================================================
     7:00 PM — 7:59 PM
     GOOD EVENING — VIDEO 3
     ======================================================= */

  if(minutes >= 1140 && minutes < 1200){

    return{

      id:"evening-3",

      period:"evening",

      greeting:"Good Evening",

      sub:
        "This moment belongs to you.",

      video:
        videos.evening[2]

    };

  }


  /* =======================================================
     8:00 PM — 11:59 PM
     GOOD NIGHT — VIDEO 1
     ======================================================= */

  return{

    id:"night-1",

    period:"night",

    greeting:"Good Night",

    sub:
      "You can pause here. Nothing needs to be solved right now.",

    video:
      videos.night[0]

  };

}


/* =========================================================
   UPDATE DATE / TIME
   ========================================================= */

function updateDateTime(){

  const now =
    new Date();


  dayBox.textContent =
    now.toLocaleDateString(
      "en-IN",
      {
        weekday:"long"
      }
    ).toUpperCase();


  dateBox.textContent =
    now.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ).toUpperCase();


  clockBox.textContent =
    now.toLocaleTimeString(
      "en-IN",
      {
        hour:"2-digit",
        minute:"2-digit",
        hour12:true
      }
    ).toUpperCase();


  periodBox.textContent =
    now.toLocaleTimeString(
      "en-IN",
      {
        hour:"numeric",
        hour12:true
      }
    )
    .replace(/[0-9:]/g,"")
    .trim()
    .toUpperCase();

}


/* =========================================================
   CURRENT EXPERIENCE
   ========================================================= */

let experience =
  getExperience();


/* =========================================================
   APPLY EXPERIENCE
   ========================================================= */

function applyExperience(nextExperience){

  experience =
    nextExperience;


  greeting.textContent =
    experience.greeting;


  greetingSub.textContent =
    experience.sub;


  loading.classList.remove("hidden");

  video.classList.remove("visible");


  video.pause();


  video.src =
    experience.video;


  video.load();


  video.currentTime = 0;


  video.addEventListener(
    "loadeddata",
    handleVideoReady,
    {
      once:true
    }
  );


  video.addEventListener(
    "canplay",
    handleVideoReady,
    {
      once:true
    }
  );

}


/* =========================================================
   VIDEO READY
   ========================================================= */

let videoReadyHandled = false;

function handleVideoReady(){

  if(videoReadyHandled){
    return;
  }


  videoReadyHandled = true;


  loading.classList.add("hidden");

  video.classList.add("visible");


  video.currentTime = 0;


  video.play().catch(
    () => {}
  );


  setTimeout(
    () => {

      videoReadyHandled = false;

    },
    100
  );

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

greeting.textContent =
  experience.greeting;

greetingSub.textContent =
  experience.sub;


/* =========================================================
   VIDEO INITIAL SETUP
   ========================================================= */

video.src =
  experience.video;

video.muted = true;

video.volume = 1;

video.preload = "auto";


/* =========================================================
   VIDEO LOADED
   ========================================================= */

video.addEventListener(
  "loadeddata",
  () => {

    loading.classList.add("hidden");

    video.classList.add("visible");

    video.currentTime = 0;

    video.play().catch(
      () => {}
    );

  },
  {
    once:true
  }
);


/* =========================================================
   VIDEO CAN PLAY
   ========================================================= */

video.addEventListener(
  "canplay",
  () => {

    loading.classList.add("hidden");

    video.classList.add("visible");

    video.play().catch(
      () => {}
    );

  },
  {
    once:true
  }
);


/* =========================================================
   AUTOPLAY
   ========================================================= */

video.play().catch(
  () => {

    video.muted = true;

    video.play().catch(
      () => {}
    );

  }
);


/* =========================================================
   KEEP DATE / TIME UPDATED
   ========================================================= */

updateDateTime();

setInterval(
  updateDateTime,
  1000
);


/* =========================================================
   AUTOMATICALLY CHECK TIME RANGE
   ========================================================= */

let currentExperienceID =
  experience.id;


setInterval(
  () => {

    const newExperience =
      getExperience();


    if(
      newExperience.id !==
      currentExperienceID
    ){

      currentExperienceID =
        newExperience.id;


      videoReadyHandled = false;


      applyExperience(
        newExperience
      );

    }

  },
  10000
);


/* =========================================================
   SOUND SYSTEM
   ========================================================= */

let soundOn = false;


/* =========================================================
   ENABLE SOUND
   ========================================================= */

function enableSound(){

  video.muted = false;

  video.volume = 1;


  video.play().catch(
    () => {}
  );


  soundOn = true;


  soundIcon.textContent =
    "🔊";


  soundButton.setAttribute(
    "aria-label",
    "Mute sound"
  );

}


/* =========================================================
   DISABLE SOUND
   ========================================================= */

function disableSound(){

  video.muted = true;


  soundOn = false;


  soundIcon.textContent =
    "🔇";


  soundButton.setAttribute(
    "aria-label",
    "Turn sound on"
  );

}


/* =========================================================
   SOUND BUTTON
   ========================================================= */

soundButton.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();


    if(soundOn){

      disableSound();

    }else{

      enableSound();

    }

  }
);


/* =========================================================
   FIRST USER INTERACTION
   ========================================================= */

document.addEventListener(
  "pointerdown",
  () => {

    /*
      Browser policy allows
      media playback after
      user interaction.

      We intentionally keep
      sound muted until the
      visitor chooses sound.
    */

    video.play().catch(
      () => {}
    );

  },
  {
    once:true,
    passive:true
  }
);


/* =========================================================
   PAGE 1 TRANSITION
   ========================================================= */

let hasTransitioned =
  false;


function openPage1(){

  if(hasTransitioned){
    return;
  }


  hasTransitioned =
    true;


  transition.classList.add(
    "active"
  );


  /*
     Stop arrival video
     before moving to Page 1.
  */

  video.pause();


  setTimeout(
    () => {

      window.location.href =
        "page1.html";

    },
    800
  );

}


/* =========================================================
   BEGIN YOUR JOURNEY
   ========================================================= */

beginButton.addEventListener(
  "click",
  () => {

    openPage1();

  }
);


/* =========================================================
   KEYBOARD SUPPORT
   ========================================================= */

document.addEventListener(
  "keydown",
  (event) => {

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      if(
        document.activeElement !==
        soundButton
      ){

        openPage1();

      }

    }

  }
);


/* =========================================================
   PREVENT ACCIDENTAL PAGE SCROLL
   ========================================================= */

document.addEventListener(
  "touchmove",
  (event) => {

    event.preventDefault();

  },
  {
    passive:false
  }
);


/* =========================================================
   VISIBILITY HANDLING
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      const newExperience =
        getExperience();


      if(
        newExperience.id !==
        currentExperienceID
      ){

        currentExperienceID =
          newExperience.id;


        videoReadyHandled = false;


        applyExperience(
          newExperience
        );

      }

    }

  }
);


/* =========================================================
   FINAL SAFETY AUTOPLAY ATTEMPT
   ========================================================= */

window.addEventListener(
  "load",
  () => {

    updateDateTime();


    video.muted = true;


    video.play().catch(
      () => {}
    );

  }
);

</script>

</body>
</html>
