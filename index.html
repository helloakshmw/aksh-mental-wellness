<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AKSH — A Safe Space for Every Mind</title>

  <meta
    name="description"
    content="AKSH — A Safe Space for Every Mind."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================
       AKSH ARRIVAL EXPERIENCE
       ========================================= -->

  <main
    class="aksh-arrival"
    id="arrival"
  >


    <!-- BACKGROUND VIDEO -->

    <video
      id="arrivalVideo"
      class="arrival-video"
      autoplay
      muted
      playsinline
      preload="auto"
    >

      <source
        id="arrivalVideoSource"
        src="aksh-morning.1.mov"
        type="video/quicktime"
      >

    </video>


    <!-- CINEMATIC OVERLAY -->

    <div class="cinematic-overlay"></div>


    <!-- =========================================
         TOP LEFT — DATE + DAY
         ========================================= -->

    <div class="date-display">

      <div
        id="currentDate"
        class="current-date"
      >
        14.08.2026
      </div>

      <div
        id="currentDay"
        class="current-day"
      >
        Friday
      </div>

    </div>


    <!-- =========================================
         TOP CENTER — AKSH IDENTITY
         ========================================= -->

    <header class="aksh-identity">


      <img
        src="aksh-icon.PNG"
        alt="AKSH"
        class="aksh-icon"
      >


      <div class="aksh-wordmark">
        AKSH
      </div>


      <div class="aksh-tagline">
        A Safe Space for Every Mind
      </div>


    </header>


    <!-- =========================================
         SOUND CONTROL
         ========================================= -->

    <button
      id="soundButton"
      class="sound-button"
      type="button"
      aria-label="Turn sound on"
    >

      <span
        id="soundIcon"
        class="sound-icon"
      >
        ◉
      </span>

      <span
        id="soundText"
        class="sound-text"
      >
        SOUND OFF
      </span>

    </button>


    <!-- =========================================
         CENTER EXPERIENCE
         ========================================= -->

    <section class="arrival-content">


      <p
        id="timeGreeting"
        class="time-greeting"
      >
        Good Morning
      </p>


      <h1
        id="arrivalQuote"
        class="arrival-quote"
      >
        Take a moment.<br>
        You have arrived.
      </h1>


      <button
        id="enterButton"
        class="begin-button"
        type="button"
      >

        <span>
          BEGIN YOUR JOURNEY
        </span>

        <span class="begin-arrow">
          →
        </span>

      </button>


    </section>


    <!-- =========================================
         BOTTOM
         ========================================= -->

    <div class="arrival-bottom">

      <span>
        MENTAL WELLNESS
      </span>

      <span>
        MEGHANA KAVERAPPA
      </span>

    </div>


  </main>


  <!-- =========================================
       NEXT SECTION
       ========================================= -->

  <section
    id="begin"
    class="feeling-section"
  >

    <div class="feeling-inner">

      <p class="eyebrow">
        BEFORE WE BEGIN
      </p>


      <h2>
        How are you
        <br>
        <em>feeling today?</em>
      </h2>


      <p class="feeling-intro">

        There is no right way to arrive here.
        <br>
        Start wherever you are.

      </p>


      <div class="feeling-grid">


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            01
          </span>

          <span class="feeling-title">
            I FEEL ANXIOUS
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            02
          </span>

          <span class="feeling-title">
            I FEEL OVERWHELMED
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            03
          </span>

          <span class="feeling-title">
            I NEED TO TALK
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            04
          </span>

          <span class="feeling-title">
            I'M JUST EXPLORING
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


      </div>


    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
