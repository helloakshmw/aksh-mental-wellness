<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090d">

<title>AKSH — A Safe Space For Every Mind</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

body{
  color:white;
}

#experience{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#08090d;
}

#backgroundVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.035);
  transition:
    opacity 1.8s ease,
    transform 8s ease;
}

#backgroundVideo.visible{
  opacity:1;
  transform:scale(1);
}

#atmosphere{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.12),
      transparent 42%
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.02) 40%,
      rgba(0,0,0,.25) 72%,
      rgba(0,0,0,.72) 100%
    );
  pointer-events:none;
}

#grain{
  position:absolute;
  inset:-50%;
  opacity:.035;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
  animation:grainMove .25s steps(2) infinite;
}

@keyframes grainMove{

0%{
transform:translate(0,0);
}

25%{
transform:translate(2%,-1%);
}

50%{
transform:translate(-1%,2%);
}

75%{
transform:translate(1%,1%);
}

100%{
transform:translate(-2%,-1%);
}

}

#interface{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:
    max(28px,env(safe-area-inset-top))
    24px
    max(32px,env(safe-area-inset-bottom))
    24px;

  z-index:5;
}

#akshIcon{
  width:92px;
  height:92px;

  object-fit:contain;

  margin-bottom:24px;

  filter:
    drop-shadow(0 15px 40px rgba(0,0,0,.35));

  animation:iconFloat 5s ease-in-out infinite;
}

@keyframes iconFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-6px);
}

}

#akshName{
  font-size:clamp(28px,5vw,48px);

  font-weight:500;

  letter-spacing:.18em;

  margin-left:.18em;

  margin-bottom:18px;

  text-shadow:
    0 6px 30px rgba(0,0,0,.35);
}

#tagline{

  font-size:clamp(13px,2vw,18px);

  font-weight:300;

  letter-spacing:.08em;

  color:rgba(255,255,255,.9);

  text-shadow:
    0 4px 22px rgba(0,0,0,.45);

}

#journey{

  position:absolute;

  bottom:9%;

  left:50%;

  transform:translateX(-50%);

  min-width:205px;

  padding:15px 27px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.45);

  background:rgba(255,255,255,.10);

  color:white;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 15px 50px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.20);

  cursor:pointer;

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease;

}

#journey:hover{

  background:rgba(255,255,255,.17);

  border-color:rgba(255,255,255,.75);

}

#journey:active{

  transform:
    translateX(-50%)
    scale(.96);

}

#sound{

  position:absolute;

  right:22px;

  bottom:24px;

  width:44px;

  height:44px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.32);

  background:rgba(0,0,0,.16);

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  z-index:10;

  cursor:pointer;

  font-size:16px;

}

#transition{

  position:absolute;

  inset:0;

  background:#08090d;

  z-index:20;

  opacity:0;

  pointer-events:none;

  transition:opacity 1s ease;

}

#transition.active{

  opacity:1;

}

@media(max-width:600px){

  #akshIcon{

    width:78px;

    height:78px;

    margin-bottom:21px;

  }

  #akshName{

    font-size:30px;

    margin-bottom:15px;

  }

  #tagline{

    max-width:320px;

    font-size:13px;

    line-height:1.6;

  }

  #journey{

    bottom:9%;

    min-width:184px;

    padding:14px 22px;

    font-size:10px;

  }

}

</style>
</head>

<body>

<div id="experience">

  <video
    id="backgroundVideo"
    autoplay
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div id="atmosphere"></div>

  <div id="grain"></div>

  <div id="interface">

    <img
      id="akshIcon"
      src="aksh-icon.PNG"
      alt="AKSH">

    <div id="akshName">
      AKSH
    </div>

    <div id="tagline">
      A Safe Space For Every Mind
    </div>

    <button id="journey">
      Begin Your Journey
    </button>

  </div>

  <button id="sound">
    🔊
  </button>

  <div id="transition"></div>

</div>

<script>

const video =
document.getElementById("backgroundVideo");

const sound =
document.getElementById("sound");

const journey =
document.getElementById("journey");

const transition =
document.getElementById("transition");

let audioOn = true;

const videos = {

morning1:"aksh-morning.1.mov",
morning2:"aksh-morning.2.mov",
morning3:"aksh-morning.3.mov",
morning4:"aksh-morning.4.mov",

afternoon1:"aksh-afternoon.1.mov",
afternoon2:"aksh-afternoon.2.mov",
afternoon3:"aksh-afternoon.3.mov",
afternoon4:"aksh-afternoon.4.mov",

evening1:"aksh-evening.1.mov",
evening2:"aksh-evening.2.mov",
evening3:"aksh-morning.4.mov",

night1:"aksh-night.1.mov",
night2:"aksh-night.2.mov"

};

function getVideo(){

  const now = new Date();

  const minutes =
    now.getHours() * 60 +
    now.getMinutes();

  if(minutes >= 300 && minutes < 360)
    return videos.morning1;

  if(minutes >= 360 && minutes < 480)
    return videos.morning2;

  if(minutes >= 480 && minutes < 600)
    return videos.morning3;

  if(minutes >= 600 && minutes < 720)
    return videos.morning4;

  if(minutes >= 720 && minutes < 780)
    return videos.afternoon1;

  if(minutes >= 780 && minutes < 870)
    return videos.afternoon2;

  if(minutes >= 870 && minutes < 960)
    return videos.afternoon3;

  if(minutes >= 960 && minutes < 1020)
    return videos.afternoon4;

  if(minutes >= 1020 && minutes < 1065)
    return videos.evening1;

  if(minutes >= 1065 && minutes < 1140)
    return videos.evening2;

  if(minutes >= 1140 && minutes < 1200)
    return videos.evening3;

  if(minutes >= 1200)
    return videos.night1;

  return videos.night2;

}

function startVideo(){

  const selected =
    getVideo();

  video.src = selected;

  video.load();

  video.muted = false;

  video.volume = 1;

  video.play()
    .then(()=>{

      sound.textContent = "🔊";

    })
    .catch(()=>{

      /*
      iPhone/Chrome may block
      audible autoplay.
      The experience stays ready
      to play sound immediately
      when the browser permits it.
      */

      video.muted = true;

      video.play().catch(()=>{});

      sound.textContent = "🔊";

    });

  video.addEventListener(
    "canplay",
    ()=>{

      video.classList.add("visible");

    },
    {once:true}
  );

}

sound.addEventListener(
  "click",
  ()=>{

    audioOn = !audioOn;

    if(audioOn){

      video.muted = false;

      video.volume = 1;

      video.play().catch(()=>{});

      sound.textContent = "🔊";

    }else{

      video.muted = true;

      sound.textContent = "🔇";

    }

  }
);

journey.addEventListener(
  "click",
  ()=>{

    transition.classList.add("active");

    setTimeout(
      ()=>{

        window.location.href =
          "page1.html";

      },
      700
    );

  }
);

startVideo();

setInterval(
  ()=>{

    const current =
      getVideo();

    if(
      video.src &&
      !video.src.endsWith(current)
    ){

      video.classList.remove("visible");

      video.src = current;

      video.load();

      video.muted = !audioOn;

      video.play().catch(()=>{});

    }

  },
  15000
);

</script>

</body>
</html>
