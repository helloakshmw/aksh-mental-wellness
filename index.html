<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#050505"
>

<title>AKSH — A Safe Space For Every Mind</title>

<style>

/* =========================================================
   AKSH ARRIVAL
   Cinematic 4-second entrance
   ========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:#fff;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}


/* =========================================================
   MAIN SCREEN
   ========================================================= */

#arrival{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#050505;

  isolation:isolate;
}


/* =========================================================
   VIDEO
   ========================================================= */

#arrivalVideo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center center;

  background:#050505;

  opacity:0;

  transform:scale(1.035);

  transition:
    opacity 1.2s ease,
    transform 4.5s cubic-bezier(.2,.7,.2,1);

  z-index:1;
}

#arrivalVideo.visible{
  opacity:1;
  transform:scale(1);
}


/* =========================================================
   CINEMATIC DARKNESS
   ========================================================= */

.video-overlay{
  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  background:

    linear-gradient(
      180deg,
      rgba(0,0,0,.48) 0%,
      rgba(0,0,0,.08) 27%,
      rgba(0,0,0,.08) 52%,
      rgba(0,0,0,.38) 100%
    );

}


/* Extra cinematic vignette */

.vignette{
  position:absolute;

  inset:-5%;

  z-index:3;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.25) 72%,
      rgba(0,0,0,.58) 100%
    );
}


/* =========================================================
   TOP LEFT — DATE
   ========================================================= */

.date-block{

  position:absolute;

  top:
    max(
      28px,
      env(safe-area-inset-top)
    );

  left:
    max(
      28px,
      env(safe-area-inset-left)
    );

  z-index:10;

  display:flex;

  flex-direction:column;

  gap:7px;

  pointer-events:none;

}

.date{

  font-family:
    "Helvetica Neue",
    Arial,
    sans-serif;

  font-size:12px;

  font-weight:400;

  letter-spacing:.16em;

  color:rgba(255,255,255,.90);

  white-space:nowrap;

}

.day{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:15px;

  font-style:italic;

  letter-spacing:.04em;

  color:rgba(255,255,255,.82);

}


/* =========================================================
   CENTER TOP — AKSH
   ========================================================= */

.brand{

  position:absolute;

  top:
    max(
      26px,
      env(safe-area-inset-top)
    );

  left:50%;

  transform:translateX(-50%);

  z-index:10;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  pointer-events:none;

}

.brand-icon{

  width:43px;
  height:43px;

  object-fit:contain;

  margin-bottom:7px;

  filter:
    drop-shadow(
      0 5px 18px
      rgba(0,0,0,.45)
    );

}

.brand-name{

  font-size:14px;

  font-weight:400;

  letter-spacing:.52em;

  margin-left:.52em;

  color:
    rgba(255,255,255,.94);

}

.brand-tagline{

  margin-top:6px;

  font-size:8px;

  letter-spacing:.15em;

  color:
    rgba(255,255,255,.72);

  white-space:nowrap;

}


/* =========================================================
   TOP RIGHT — SOUND
   ========================================================= */

.sound-button{

  position:absolute;

  top:
    max(
      25px,
      env(safe-area-inset-top)
    );

  right:
    max(
      24px,
      env(safe-area-inset-right)
    );

  z-index:20;

  height:44px;

  min-width:132px;

  padding:
    0 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  border:

    1px solid
    rgba(255,255,255,.42);

  border-radius:999px;

  background:
    rgba(0,0,0,.18);

  color:#fff;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  cursor:pointer;

  font-size:9px;

  letter-spacing:.18em;

  text-transform:uppercase;

  transition:
    background .3s ease,
    border-color .3s ease,
    transform .3s ease;

  -webkit-tap-highlight-color:
    transparent;

}

.sound-button:active{

  transform:scale(.96);

}

.sound-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#e6c27a;

  box-shadow:
    0 0 10px
    rgba(230,194,122,.65);

}

.sound-button.on{

  background:
    rgba(255,255,255,.15);

  border-color:
    rgba(255,255,255,.68);

}


/* =========================================================
   CENTER MESSAGE
   ========================================================= */

.center-content{

  position:absolute;

  inset:0;

  z-index:8;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
    120px
    30px
    150px;

  pointer-events:none;

}


/* Greeting */

#greeting{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  font-size:
    clamp(
      12px,
      1.5vw,
      18px
    );

  font-weight:400;

  letter-spacing:.34em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.88);

  margin-bottom:19px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.55);

}


/* Main quote */

#quote{

  max-width:
    min(
      820px,
      90vw
    );

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      26px,
      4.3vw,
      64px
    );

  font-weight:400;

  line-height:1.08;

  letter-spacing:-.025em;

  color:#fff;

  text-shadow:
    0 7px 35px
    rgba(0,0,0,.55);

}


/* =========================================================
   JOURNEY BUTTON
   ========================================================= */

.journey-button{

  position:absolute;

  left:50%;

  bottom:
    max(
      82px,
      calc(
        72px +
        env(safe-area-inset-bottom)
      )
    );

  transform:
    translateX(-50%);

  z-index:15;

  min-width:238px;

  height:54px;

  padding:
    0 27px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:27px;

  border:
    1px solid
    rgba(255,255,255,.55);

  border-radius:999px;

  background:
    rgba(20,20,20,.24);

  color:#fff;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  cursor:pointer;

  font-size:10px;

  font-weight:400;

  letter-spacing:.20em;

  text-transform:uppercase;

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease;

  -webkit-tap-highlight-color:
    transparent;

}

.journey-arrow{

  font-size:22px;

  line-height:1;

  color:#e6c27a;

  transition:
    transform .35s ease;

}

.journey-button:hover{

  background:
    rgba(255,255,255,.13);

  border-color:
    rgba(255,255,255,.82);

}

.journey-button:hover
.journey-arrow{

  transform:
    translateX(5px);

}

.journey-button:active{

  transform:
    translateX(-50%)
    scale(.97);

}


/* =========================================================
   BOTTOM CORNERS
   ========================================================= */

.bottom-left{

  position:absolute;

  left:
    max(
      27px,
      env(safe-area-inset-left)
    );

  bottom:
    max(
      25px,
      env(safe-area-inset-bottom)
    );

  z-index:10;

  font-size:8px;

  letter-spacing:.18em;

  color:
    rgba(255,255,255,.62);

  text-transform:uppercase;

}

.bottom-right{

  position:absolute;

  right:
    max(
      27px,
      env(safe-area-inset-right)
    );

  bottom:
    max(
      25px,
      env(safe-area-inset-bottom)
    );

  z-index:10;

  font-size:8px;

  letter-spacing:.16em;

  color:
    rgba(255,255,255,.62);

  text-transform:uppercase;

}


/* =========================================================
   LOADING
   ========================================================= */

.loading{

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  z-index:6;

  width:30px;
  height:30px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-top-color:
    rgba(255,255,255,.85);

  border-radius:50%;

  animation:
    spin .9s linear infinite;

  opacity:1;

  transition:
    opacity .5s ease;

}

.loading.hidden{

  opacity:0;

}

@keyframes spin{

  to{
    transform:
      translate(-50%,-50%)
      rotate(360deg);
  }

}


/* =========================================================
   PAGE TRANSITION
   ========================================================= */

#transition{

  position:absolute;

  inset:0;

  z-index:100;

  background:#050505;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .85s
    cubic-bezier(.65,0,.35,1);

}

#transition.active{

  opacity:1;

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width:1200px){

  .date{

    font-size:13px;

  }

  .day{

    font-size:17px;

  }

  .brand-icon{

    width:50px;
    height:50px;

  }

  .brand-name{

    font-size:15px;

  }

  .brand-tagline{

    font-size:9px;

  }

  .sound-button{

    height:46px;

    min-width:145px;

    font-size:10px;

  }

}


/* =========================================================
   TABLET
   ========================================================= */

@media
(min-width:601px)
and
(max-width:1199px){

  .center-content{

    padding-left:8vw;
    padding-right:8vw;

  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:600px){

  .video-overlay{

    background:

      linear-gradient(
        180deg,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,.10) 30%,
        rgba(0,0,0,.12) 55%,
        rgba(0,0,0,.52) 100%
      );

  }


  .date-block{

    top:
      max(
        23px,
        env(safe-area-inset-top)
      );

    left:
      max(
        20px,
        env(safe-area-inset-left)
      );

  }


  .date{

    font-size:11px;

    letter-spacing:.11em;

  }


  .day{

    font-size:14px;

  }


  .brand{

    top:
      max(
        21px,
        env(safe-area-inset-top)
      );

  }


  .brand-icon{

    width:37px;
    height:37px;

    margin-bottom:5px;

  }


  .brand-name{

    font-size:12px;

    letter-spacing:.43em;

    margin-left:.43em;

  }


  .brand-tagline{

    font-size:7px;

    letter-spacing:.10em;

  }


  .sound-button{

    top:
      max(
        20px,
        env(safe-area-inset-top)
      );

    right:
      max(
        17px,
        env(safe-area-inset-right)
      );

    min-width:112px;

    height:40px;

    padding:
      0 13px;

    gap:8px;

    font-size:8px;

    letter-spacing:.13em;

  }


  .sound-dot{

    width:7px;
    height:7px;

  }


  .center-content{

    padding:
      150px
      20px
      170px;

  }


  #greeting{

    font-size:11px;

    letter-spacing:.25em;

    margin-bottom:17px;

  }


  #quote{

    max-width:92vw;

    font-size:
      clamp(
        28px,
        8.5vw,
        43px
      );

    line-height:1.08;

    letter-spacing:-.025em;

  }


  .journey-button{

    bottom:
      max(
        82px,
        calc(
          72px +
          env(safe-area-inset-bottom)
        )
      );

    min-width:210px;

    height:51px;

    gap:20px;

    font-size:9px;

  }


  .bottom-left{

    left:
      max(
        20px,
        env(safe-area-inset-left)
      );

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    font-size:7px;

  }


  .bottom-right{

    right:
      max(
        20px,
        env(safe-area-inset-right)
      );

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    font-size:7px;

  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-height:700px){

  .center-content{

    padding-top:120px;
    padding-bottom:130px;

  }


  #quote{

    font-size:
      clamp(
        25px,
        8vw,
        37px
      );

  }


  .journey-button{

    bottom:65px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media
(prefers-reduced-motion:reduce){

  #arrivalVideo{

    transition:none;

    transform:none;

  }

  .journey-button{

    transition:none;

  }

  #transition{

    transition:none;

  }

}

</style>

</head>


<body>


<div id="arrival">


  <!-- =====================================================
       VIDEO
       ===================================================== -->

  <video
    id="arrivalVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback
  ></video>


  <!-- Cinematic layers -->

  <div class="video-overlay"></div>

  <div class="vignette"></div>


  <!-- Loading indicator -->

  <div
    id="loading"
    class="loading"
  ></div>


  <!-- =====================================================
       DATE
       ===================================================== -->

  <div class="date-block">

    <div
      id="date"
      class="date"
    ></div>

    <div
      id="day"
      class="day"
    ></div>

  </div>


  <!-- =====================================================
       AKSH BRAND
       ===================================================== -->

  <div class="brand">

    <img
      src="aksh-icon.PNG"
      class="brand-icon"
      alt="AKSH"
    >

    <div class="brand-name">
      AKSH
    </div>

    <div class="brand-tagline">
      A Safe Space For Every Mind
    </div>

  </div>


  <!-- =====================================================
       SOUND
       ===================================================== -->

  <button
    id="soundButton"
    class="sound-button"
    type="button"
    aria-label="Turn sound on"
  >

    <span
      id="soundDot"
      class="sound-dot"
    ></span>

    <span id="soundText">
      SOUND OFF
    </span>

  </button>


  <!-- =====================================================
       CENTER
       ===================================================== -->

  <main class="center-content">

    <div id="greeting">
      Good Morning
    </div>

    <div id="quote">
      Come as you are.
    </div>

  </main>


  <!-- =====================================================
       BEGIN JOURNEY
       ===================================================== -->

  <button
    id="journeyButton"
    class="journey-button"
    type="button"
  >

    <span>
      Begin Your Journey
    </span>

    <span class="journey-arrow">
      →
    </span>

  </button>


  <!-- =====================================================
       BOTTOM
       ===================================================== -->

  <div class="bottom-left">
    Mental Wellness
  </div>

  <div class="bottom-right">
    Meghana Kaverappa
  </div>


  <!-- =====================================================
       TRANSITION
       ===================================================== -->

  <div id="transition"></div>


</div>


<script>

/* =========================================================
   AKSH ARRIVAL EXPERIENCE ENGINE
   ========================================================= */


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const video =
  document.getElementById("arrivalVideo");

const dateBox =
  document.getElementById("date");

const dayBox =
  document.getElementById("day");

const greeting =
  document.getElementById("greeting");

const quote =
  document.getElementById("quote");

const soundButton =
  document.getElementById("soundButton");

const soundText =
  document.getElementById("soundText");

const journeyButton =
  document.getElementById("journeyButton");

const transition =
  document.getElementById("transition");

const loading =
  document.getElementById("loading");


/* ---------------------------------------------------------
   VIDEO FILES
   --------------------------------------------------------- */

const videos = {

  morning1:
    "aksh-morning.1.mov",

  morning2:
    "aksh-morning.2.mov",

  morning3:
    "aksh-morning.3.mov",

  morning4:
    "aksh-morning.4.mov",


  afternoon1:
    "aksh-afternoon.1.mov",

  afternoon2:
    "aksh-afternoon.2.mov",

  afternoon3:
    "aksh-afternoon.3.mov",

  afternoon4:
    "aksh-afternoon.4.mov",


  evening1:
    "aksh-evening.1.mov",

  evening2:
    "aksh-evening.2.mov",

  evening3:
    "aksh-evening.3.mov",


  night1:
    "aksh-night.1.mov",

  night2:
    "aksh-night.2.mov"

};


/* ---------------------------------------------------------
   QUOTES
   Different quote every visit.
   --------------------------------------------------------- */

const quotes = {

  morning: [

    "Come as you are.",

    "Begin gently. The day can wait.",

    "Take a breath. There is time.",

    "Let today meet you exactly as you are.",

    "You do not have to rush into the day.",

    "Start with one peaceful thought.",

    "You are allowed to move slowly.",

    "A new morning is another chance to begin.",

    "You don't need to have everything figured out today.",

    "Give yourself permission to simply begin."

  ],


  afternoon: [

    "Pause for a moment. Notice where you are.",

    "You are allowed to pause in the middle of everything.",

    "Take a breath before taking the next step.",

    "There is still time to choose yourself.",

    "You don't have to carry everything at once.",

    "Your wellbeing belongs in the middle of your day too.",

    "Not every moment needs an answer.",

    "You are more than what you accomplish today.",

    "Pause. Breathe. Continue when you are ready.",

    "Whatever today feels like, you can meet it gently."

  ],


  evening: [

    "Let the day become quieter.",

    "You have made it this far. Breathe.",

    "The day does not need to end perfectly.",

    "Leave some space for yourself tonight.",

    "You can put down what no longer needs carrying.",

    "Let yourself arrive here.",

    "You deserve a moment without expectations.",

    "Slow down. You are safe to pause.",

    "The evening is allowed to be gentle.",

    "Somewhere between today and tomorrow, there is rest."

  ],


  night: [

    "Nothing needs to be solved tonight.",

    "Rest is also a form of moving forward.",

    "Tomorrow can wait.",

    "You have permission to rest.",

    "The night does not ask anything from you.",

    "Breathe. You have done enough for today.",

    "Some answers arrive after we stop searching.",

    "Close the day gently.",

    "You can simply be here.",

    "Let your mind become quiet, one breath at a time."

  ]

};


/* ---------------------------------------------------------
   CURRENT TIME
   --------------------------------------------------------- */

const now =
  new Date();

const minutes =
  now.getHours() * 60 +
  now.getMinutes();


/* ---------------------------------------------------------
   TIME SELECTION
   --------------------------------------------------------- */

let period;
let selectedVideo;
let greetingText;


/* MORNING */

if (
  minutes >= 300 &&
  minutes < 360
){

  period = "morning";

  selectedVideo =
    videos.morning1;

  greetingText =
    "Good Morning";

}

else if (
  minutes >= 360 &&
  minutes < 480
){

  period = "morning";

  selectedVideo =
    videos.morning2;

  greetingText =
    "Good Morning";

}

else if (
  minutes >= 480 &&
  minutes < 600
){

  period = "morning";

  selectedVideo =
    videos.morning3;

  greetingText =
    "Good Morning";

}

else if (
  minutes >= 600 &&
  minutes < 720
){

  period = "morning";

  selectedVideo =
    videos.morning4;

  greetingText =
    "Good Morning";

}


/* AFTERNOON */

else if (
  minutes >= 720 &&
  minutes < 780
){

  period = "afternoon";

  selectedVideo =
    videos.afternoon1;

  greetingText =
    "Good Afternoon";

}

else if (
  minutes >= 780 &&
  minutes < 870
){

  period = "afternoon";

  selectedVideo =
    videos.afternoon2;

  greetingText =
    "Good Afternoon";

}

else if (
  minutes >= 870 &&
  minutes < 960
){

  period = "afternoon";

  selectedVideo =
    videos.afternoon3;

  greetingText =
    "Good Afternoon";

}

else if (
  minutes >= 960 &&
  minutes < 1020
){

  period = "afternoon";

  selectedVideo =
    videos.afternoon4;

  greetingText =
    "Good Afternoon";

}


/* EVENING */

else if (
  minutes >= 1020 &&
  minutes < 1065
){

  period = "evening";

  selectedVideo =
    videos.evening1;

  greetingText =
    "Good Evening";

}

else if (
  minutes >= 1065 &&
  minutes < 1140
){

  period = "evening";

  selectedVideo =
    videos.evening2;

  greetingText =
    "Good Evening";

}

else if (
  minutes >= 1140 &&
  minutes < 1200
){

  period = "evening";

  selectedVideo =
    videos.evening3;

  greetingText =
    "Good Evening";

}


/* NIGHT */

else if (
  minutes >= 1200
){

  period = "night";

  selectedVideo =
    videos.night1;

  greetingText =
    "Good Night";

}

else{

  period = "night";

  selectedVideo =
    videos.night2;

  greetingText =
    "Good Night";

}


/* ---------------------------------------------------------
   DATE
   Required format:
   14.08.2026
   Friday
   --------------------------------------------------------- */

const day =
  String(
    now.getDate()
  ).padStart(2,"0");

const month =
  String(
    now.getMonth() + 1
  ).padStart(2,"0");

const year =
  now.getFullYear();


const weekday =
  now.toLocaleDateString(
    "en-IN",
    {
      weekday:"long"
    }
  );


dateBox.textContent =
  `${day}.${month}.${year}`;

dayBox.textContent =
  weekday;

/* ---------------------------------------------------------
   DIFFERENT QUOTE
   --------------------------------------------------------- */

function chooseQuote(){

  const list =
    quotes[period];

  /*
    Use date + time + random value
    so repeated visitors don't all
    necessarily see the same quote.
  */

  const randomIndex =
    Math.floor(
      Math.random() *
      list.length
    );

  return list[randomIndex];

}


quote.textContent =
  chooseQuote();


/* ---------------------------------------------------------
   LOAD VIDEO
   --------------------------------------------------------- */

let journeyStarted =
  false;

let transitionStarted =
  false;

let fourSecondTimer =
  null;


function startArrival(){

  if (
    journeyStarted
  ){

    return;

  }


  if (
    !selectedVideo
  ){

    return;

  }


  video.src =
    selectedVideo;


  video.muted =
    true;


  video.setAttribute(
    "muted",
    ""
  );


  video.setAttribute(
    "playsinline",
    ""
  );


  video.setAttribute(
    "webkit-playsinline",
    ""
  );


  video.load();


  const playVideo =
    () => {

      const playPromise =
        video.play();


      if (
        playPromise &&
        typeof playPromise.catch ===
        "function"
      ){

        playPromise.catch(
          () => {

            /*
              iPhone may require a user
              interaction in some cases.

              The sound button / page tap
              will retry playback.
            */

          }
        );

      }

    };


  video.addEventListener(
    "canplay",
    () => {

      loading.classList.add(
        "hidden"
      );

      video.classList.add(
        "visible"
      );


      playVideo();


      /*
        The four-second experience
        begins once the video is ready.
      */

      if (
        !fourSecondTimer
      ){

        fourSecondTimer =
          setTimeout(
            openPage1,
            4000
          );

      }

    },
    {
      once:true
    }
  );


  /*
    Backup in case the browser
    already has enough data.
  */

  video.addEventListener(
    "loadeddata",
    () => {

      video.classList.add(
        "visible"
      );

      playVideo();

    },
    {
      once:true
    }
  );


  /*
    Final fallback.
  */

  setTimeout(
    () => {

      if (
        !video.classList.contains(
          "visible"
        )
      ){

        video.classList.add(
          "visible"
        );

        loading.classList.add(
          "hidden"
        );

        playVideo();

      }

    },
    1800
  );

}


/* ---------------------------------------------------------
   PAGE 1 TRANSITION
   --------------------------------------------------------- */

function openPage1(){

  if (
    transitionStarted
  ){

    return;

  }


  transitionStarted =
    true;


  if (
    fourSecondTimer
  ){

    clearTimeout(
      fourSecondTimer
    );

  }


  transition.classList.add(
    "active"
  );


  /*
    Give the black cinematic
    transition enough time to
    cover the old page.
  */

  setTimeout(
    () => {

      window.location.href =
        "page1.html";

    },
    780
  );

}


/* ---------------------------------------------------------
   BEGIN JOURNEY
   --------------------------------------------------------- */

journeyButton.addEventListener(
  "click",
  () => {

    openPage1();

  }
);


/* ---------------------------------------------------------
   SOUND
   --------------------------------------------------------- */

let soundOn =
  false;


soundButton.addEventListener(
  "click",
  (event) => {

    /*
      Prevent the button tap
      from affecting anything else.
    */

    event.stopPropagation();


    if (
      soundOn
    ){

      video.muted =
        true;

      soundOn =
        false;

      soundText.textContent =
        "SOUND OFF";

      soundButton.classList.remove(
        "on"
      );

      soundButton.setAttribute(
        "aria-label",
        "Turn sound on"
      );

      return;

    }


    /*
      This tap is a genuine
      user interaction, so iPhone
      allows us to enable sound.
    */

    video.muted =
      false;

    video.volume =
      1;


    const playPromise =
      video.play();


    if (
      playPromise &&
      typeof playPromise.catch ===
      "function"
    ){

      playPromise.catch(
        () => {

          /*
            If the browser still
            refuses sound, keep the
            visual state safe.
          */

          video.muted =
            true;

          soundOn =
            false;

          soundText.textContent =
            "SOUND OFF";

        }
      );

    }


    soundOn =
      true;

    soundText.textContent =
      "SOUND ON";

    soundButton.classList.add(
      "on"
    );

    soundButton.setAttribute(
      "aria-label",
      "Turn sound off"
    );

  }
);


/* ---------------------------------------------------------
   ANY FIRST TOUCH
   --------------------------------------------------------- */

document.addEventListener(
  "touchstart",
  () => {

    /*
      If the video was prevented
      from starting automatically,
      a genuine touch gives us a
      chance to start it.

      We do NOT automatically
      unmute it.
    */

    if (
      video.paused
    ){

      video.muted =
        true;

      video.play().catch(
        () => {}
      );

    }

  },
  {
    passive:true,
    once:true
  }
);


/* ---------------------------------------------------------
   DESKTOP FALLBACK
   --------------------------------------------------------- */

document.addEventListener(
  "click",
  () => {

    if (
      video.paused
    ){

      video.muted =
        true;

      video.play().catch(
        () => {}
      );

    }

  },
  {
    passive:true,
    once:true
  }
);


/* ---------------------------------------------------------
   START
   --------------------------------------------------------- */

startArrival();
