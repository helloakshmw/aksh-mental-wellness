<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKSH — A Safe Space for Every Mind</title>

  <meta
    name="description"
    content="AKSH Mental Wellness — A Safe Space for Every Mind."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       ARRIVAL
       ============================== -->

  <main class="arrival" id="arrival">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <nav class="nav">

      <a href="#arrival" class="brand" aria-label="AKSH Home">

        <span class="brand-mark">A</span>

        <span class="brand-name">
          AKSH
        </span>

      </a>

      <button
        class="menu-button"
        type="button"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
      </button>

    </nav>


    <section class="hero">

      <p class="eyebrow">
        MENTAL WELLNESS
      </p>

      <h1>
        A safe space
        <br>
        <em>for every mind.</em>
      </h1>

      <p class="intro">
        Come as you are.
        <br>
        There is space for you here.
      </p>

      <button
        class="enter-button"
        id="enterButton"
        type="button"
      >

        <span>
          ENTER AKSH
        </span>

        <span class="arrow">
          →
        </span>

      </button>

    </section>


    <div class="bottom-note">

      <span>
        FOUNDED BY
      </span>

      <strong>
        MEGHANA KAVERAPPA
      </strong>

    </div>

  </main>


  <!-- ==============================
       FEELING EXPERIENCE
       ============================== -->

  <section
    class="feeling-section"
    id="begin"
  >

    <div class="feeling-inner">

      <p class="eyebrow">
        BEFORE WE BEGIN
      </p>

      <h2>
        How are you
        <br>
        <em>feeling today?</em>
      </h2>

      <p class="feeling-intro">
        There is no right way to arrive here.
        <br>
        Start wherever you are.
      </p>


      <div class="feeling-grid">


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            01
          </span>

          <span class="feeling-title">
            I FEEL ANXIOUS
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            02
          </span>

          <span class="feeling-title">
            I FEEL OVERWHELMED
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            03
          </span>

          <span class="feeling-title">
            I NEED TO TALK
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


        <button
          class="feeling-card"
          type="button"
        >

          <span class="number">
            04
          </span>

          <span class="feeling-title">
            I'M JUST EXPLORING
          </span>

          <span class="feeling-arrow">
            ↗
          </span>

        </button>


      </div>

    </div>

  </section>


  <!-- ==============================
       JAVASCRIPT
       ============================== -->

  <script src="script.js"></script>

</body>
</html>
