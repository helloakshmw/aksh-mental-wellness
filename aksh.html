<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07100d">
  <title>AKSH — How Are You Feeling Today?</title>

  <style>
    :root {
      --bg: #07100d;
      --text: #f5f3ed;
      --muted: rgba(245,243,237,.66);
      --line: rgba(255,255,255,.18);
      --glass: rgba(255,255,255,.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(72,105,88,.18), transparent 42%),
        linear-gradient(180deg, #0a1511 0%, #07100d 55%, #050b09 100%);
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 70%, rgba(145,119,82,.10), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(87,119,102,.10), transparent 30%);
    }

    /* NAVIGATION */

    .nav {
      position: relative;
      z-index: 10;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 70px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: .24em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 3vw, 42px);
    }

    .nav-links a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: color .3s ease;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-book {
      padding: 11px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    /* HERO */

    .hero {
      position: relative;
      z-index: 2;
      min-height: calc(100svh - 82px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(45px, 8vh, 95px) 24px 70px;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(255,255,255,.48);
      margin-bottom: 22px;
    }

    .title {
      max-width: 900px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 7.5vw, 104px);
      line-height: .94;
      font-weight: 400;
      letter-spacing: -.045em;
    }

    .title em {
      font-style: italic;
      color: rgba(245,243,237,.82);
    }

    .intro {
      max-width: 520px;
      margin-top: 25px;
      color: var(--muted);
      font-size: clamp(12px, 1.15vw, 15px);
      line-height: 1.75;
    }

    /* FEELING EXPERIENCE */

    .feeling-area {
      width: min(1180px, 100%);
      margin-top: clamp(48px, 8vh, 82px);
    }

    .feeling-label {
      margin-bottom: 18px;
      font-size: 8px;
      letter-spacing: .27em;
      text-transform: uppercase;
      color: rgba(255,255,255,.40);
    }

    /*
      IMPORTANT:
      Four cards intentionally occupy only a small footprint.
      The visual system expands the selected card.
    */

    .emotion-track {
      width: 100%;
      height: 118px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .emotion-card {
      position: relative;
      min-width: 0;
      height: 118px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition:
        flex .65s cubic-bezier(.16,1,.3,1),
        width .65s cubic-bezier(.16,1,.3,1),
        transform .45s ease,
        border-color .45s ease,
        background .45s ease;
      text-align: left;
      isolation: isolate;
    }

    .emotion-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.11), transparent 45%);
      opacity: .65;
    }

    .emotion-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.28);
    }

    .emotion-card.active {
      border-color: rgba(255,255,255,.42);
      background:
        linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
    }

    .emotion-button {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 17px;
      text-align: left;
    }

    .emotion-icon {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      background: rgba(255,255,255,.055);
      font-size: 17px;
    }

    .emotion-content {
      min-width: 0;
    }

    .emotion-number {
      display: block;
      margin-bottom: 7px;
      font-size: 7px;
      letter-spacing: .2em;
      color: rgba(255,255,255,.36);
    }

    .emotion-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(9px, 1vw, 12px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .emotion-description {
      max-width: 440px;
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.6;
      color: rgba(255,255,255,.58);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease .12s, transform .45s ease .12s;
    }

    .emotion-card.active .emotion-description {
      opacity: 1;
      transform: translateY(0);
    }

    .emotion-open {
      position: absolute;
      right: 18px;
      bottom: 16px;
      font-size: 16px;
      opacity: .45;
      transition: transform .35s ease, opacity .35s ease;
    }

    .emotion-card:hover .emotion-open,
    .emotion-card.active .emotion-open {
      opacity: 1;
      transform: translateX(4px);
    }

    /* BOTTOM */

    .bottom-note {
      margin-top: 24px;
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.32);
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .nav {
        height: 72px;
      }

      .nav-links a:not(.nav-book) {
        display: none;
      }

      .hero {
        min-height: calc(100svh - 72px);
        padding-top: 48px;
      }

      .emotion-track {
        height: 104px;
        gap: 7px;
      }

      .emotion-card {
        height: 104px;
        border-radius: 15px;
      }

      .emotion-button {
        padding: 12px;
        gap: 9px;
      }

      .emotion-icon {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        font-size: 14px;
      }

      .emotion-title {
        font-size: 8px;
      }

      .emotion-description,
      .emotion-open {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .nav {
        padding: 0 18px;
      }

      .brand img {
        width: 32px;
        height: 32px;
      }

      .brand-name {
        font-size: 15px;
      }

      .nav-book {
        padding: 9px 13px;
        font-size: 7px !important;
      }

      .hero {
        padding: 42px 18px 45px;
      }

      .eyebrow {
        font-size: 7px;
        letter-spacing: .24em;
        margin-bottom: 18px;
      }

      .title {
        font-size: clamp(43px, 13vw, 67px);
      }

      .intro {
        max-width: 330px;
        font-size: 11px;
        line-height: 1.65;
      }

      .feeling-area {
        margin-top: 46px;
      }

      /*
        Mobile:
        Cards are intentionally compact.
        4 cards together = only a small portion of the screen.
      */

      .emotion-track {
        height: 76px;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }

      .emotion-card {
        height: 76px;
        border-radius: 12px;
      }

      .emotion-button {
        padding: 8px 5px;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        align-items: center;
        text-align: center;
      }

      .emotion-icon {
        flex-basis: 29px;
        width: 29px;
        height: 29px;
        font-size: 12px;
      }

      .emotion-number {
        display: none;
      }

      .emotion-title {
        white-space: normal;
        font-size: 6px;
        line-height: 1.35;
        letter-spacing: .08em;
      }

      .bottom-note {
        margin-top: 18px;
        font-size: 6px;
      }
    }

    @media (max-width: 380px) {
      .title {
        font-size: 40px;
      }

      .intro {
        font-size: 10px;
      }

      .emotion-track {
        height: 70px;
        gap: 4px;
      }

      .emotion-card {
        height: 70px;
      }

      .emotion-icon {
        width: 25px;
        height: 25px;
        flex-basis: 25px;
        font-size: 10px;
      }

      .emotion-title {
        font-size: 5.5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="ambient"></div>

    <header class="nav">
      <a class="brand" href="page1.html" aria-label="AKSH Home">
        <img src="aksh-icon.PNG" alt="AKSH">
        <span class="brand-name">AKSH</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="#feeling">THE WORLD</a>
        <a href="#feeling">THE MIND</a>
        <a href="#feeling">WITH YOU</a>
        <a class="nav-book" href="page1.html">BOOK</a>
      </nav>
    </header>

    <main class="hero">

      <div class="eyebrow">01 — AKSH</div>

      <h1 class="title">
        How are you<br>
        <em>feeling today?</em>
      </h1>

      <p class="intro">
        There is no right way to arrive here.
        Choose what feels closest to you.
        You can stay for a moment, explore,
        or simply breathe.
      </p>

      <section class="feeling-area" id="feeling">

        <div class="feeling-label">
          Begin wherever you are
        </div>

        <div class="emotion-track">

          <article class="emotion-card" data-emotion="anxious">
            <button class="emotion-button" type="button">
              <span class="emotion-icon" aria-hidden="true">◌</span>

              <span class="emotion-content">
                <span class="emotion-number">01</span>
                <span class="emotion-title">Anxious</span>

                <span class="emotion-description">
                  A quieter place to pause, breathe and understand
                  what is happening inside.
                </span>
              </span>

              <span class="emotion-open" aria-hidden="true">→</span>
            </button>
          </article>

          <article class="emotion-card" data-emotion="overwhelmed">
            <button class="emotion-button" type="button">
              <span class="emotion-icon" aria-hidden="true">⌁</span>

              <span class="emotion-content">
                <span class="emotion-number">02</span>
                <span class="emotion-title">Overwhelmed</span>

                <span class="emotion-description">
                  You do not have to figure everything out at once.
                  Start with one small moment.
                </span>
              </span>

              <span class="emotion-open" aria-hidden="true">→</span>
            </button>
          </article>

          <article class="emotion-card" data-emotion="talk">
            <button class="emotion-button" type="button">
              <span class="emotion-icon" aria-hidden="true">○</span>

              <span class="emotion-content">
                <span class="emotion-number">03</span>
                <span class="emotion-title">Need to talk</span>

                <span class="emotion-description">
                  Sometimes being heard is where the journey begins.
                </span>
              </span>

              <span class="emotion-open" aria-hidden="true">→</span>
            </button>
          </article>

          <article class="emotion-card" data-emotion="exploring">
            <button class="emotion-button" type="button">
              <span class="emotion-icon" aria-hidden="true">✦</span>

              <span class="emotion-content">
                <span class="emotion-number">04</span>
                <span class="emotion-title">Just exploring</span>

                <span class="emotion-description">
                  Take your time. Discover AKSH at your own pace.
                </span>
              </span>

              <span class="emotion-open" aria-hidden="true">→</span>
            </button>
          </article>

        </div>

        <div class="bottom-note">
          Come as you are
        </div>

      </section>

    </main>
  </div>

  <script>
    /*
      PAGE 1 — BASIC INTERACTION

      This file intentionally does not depend on page9.html
      or any other missing page.

      The cards expand locally first.
    */

    const cards = document.querySelectorAll(".emotion-card");

    cards.forEach((card) => {
      const button = card.querySelector(".emotion-button");

      button.addEventListener("click", () => {
        const wasActive = card.classList.contains("active");

        cards.forEach((item) => {
          item.classList.remove("active");
        });

        if (!wasActive) {
          card.classList.add("active");
        }
      });
    });
  </script>

</body>
</html>
